    stat(tiles, { label: 'Gap to peers', value: pvv == null ? '—' : fmt.bps(mv - pvv), delta: pvv == null ? '' : good(mv - pvv) ? 'better than peers' : 'worse than peers', deltaTone: pvv == null ? '' : good(mv - pvv) ? 'good' : 'bad' });
    stat(tiles, { label: 'Gap to industry', value: fmt.bps(mv - iv), delta: good(mv - iv) ? 'better than industry' : 'worse than industry', deltaTone: good(mv - iv) ? 'good' : 'bad' });

    const g = h('div', 'grid g2', root);
    g.style.marginTop = '16px';
    const mS = S.series('member', metric, f), iS = S.series('industry', metric, f);
    const c1 = card(g, {
      title: `${M.name}: trend`, sub: `${prodLong(p)} · ${stateName(s)}`,
      source: sourceText(['member', 'peers', 'industry']),
      table: () => ({ cols: [{ name: 'Month' }, { name: 'You', r: 1 }, { name: 'Peers', r: 1 }, { name: 'Industry', r: 1 }], rows: mS.map((x, i) => [ml(x.x), fmt.pct(x.y), ps.suppressed ? 'Suppressed' : fmt.pct(ps.points[i].y), fmt.pct(iS[i].y)]) })
    });
    PIQ.charts.line(c1.viz, {
      series: [{ name: C.member.name, color: 'var(--s1)', points: mS }, { name: group.name, color: 'var(--s2)', points: ps.points }, { name: 'Industry', color: 'var(--s3)', points: iS }],
      xLabel: ml, yFmt: (v) => fmt.pct(v), yTickFmt: fmt.metricTick(metric), endLabels: true, height: 270
    });

    const topStates = D.STATES.slice().sort((a, b) => S.value('member', 'bal', { p, s: b.id, m: t }) - S.value('member', 'bal', { p, s: a.id, m: t })).slice(0, 12);
    const rows = topStates.map((x) => ({
      label: x.name,
      values: { mem: S.value('member', metric, { p, s: x.id, m: t }), peer: S.peerValue(group.id === 'custom' ? group : group.id, metric, { p, s: x.id, m: t }), ind: S.value('industry', metric, { p, s: x.id, m: t }) }
    }));
    const c2 = card(g, {
      title: `${M.short} by state`, sub: ml(t) + ' · your 12 largest states · the gap between dots is your story',
      source: sourceText(['member', 'peers', 'industry']),
      table: () => ({ cols: [{ name: 'State' }, { name: 'You', r: 1 }, { name: 'Peers', r: 1 }, { name: 'Industry', r: 1 }], rows: rows.map((r) => [r.label, fmt.pct(r.values.mem), fmt.pct(r.values.peer), fmt.pct(r.values.ind)]) })
    });
    PIQ.charts.dots(c2.viz, { rows, series: [{ key: 'mem', name: C.member.name, color: 'var(--s1)' }, { key: 'peer', name: 'Peers', color: 'var(--s2)' }, { key: 'ind', name: 'Industry', color: 'var(--s3)' }], fmt: (v) => fmt.pct(v) });

    // Diverging heatmap: member vs industry ratio
    // Rows are products for the whole book (like-for-like needs the same product), states otherwise
    const byProd = p === 'ALL';
    const rowList = byProd ? D.PRODUCTS.map((x) => ({ id: x.id, name: x.name, f: { p: x.id, s } })) : topStates.map((x) => ({ id: x.id, name: x.name, f: { p, s: x.id } }));
    const c3 = card(g, { cls: 'span2', title: `Where you differ from the market: ${byProd ? 'product' : 'state'} × risk band`, sub: `Your ${M.short} ÷ industry ${M.short} in the same cell (${ml(t)}). ${M.bad ? 'Red = worse than market, blue = better.' : 'Blue = better than market, red = worse.'}`, source: sourceText(['member', 'industry'], 'like-for-like segments remove mix effects') });
    const tb = h('table', 'tbl heat', h('div', 'table-wrap', c3.viz));
    const hr = h('tr', null, h('thead', null, tb));
    h('th', null, hr, byProd ? 'Product' : 'State');
    D.BANDS.forEach((b) => { const th = h('th', null, hr, b.name + ' (' + b.range + ')'); th.style.textAlign = 'center'; });
    const body = h('tbody', null, tb);
    rowList.forEach((x) => {
      const r = h('tr', null, body);
      h('td', null, r, x.name);
      D.BANDS.forEach((b) => {
        const a = S.value('member', metric, Object.assign({ b: b.id, m: t }, x.f)), ii = S.value('industry', metric, Object.assign({ b: b.id, m: t }, x.f));
        const ratio = a / ii;
        const worse = M.bad ? ratio > 1 : ratio < 1;
        const k = Math.min(1, Math.abs(Math.log(ratio)) / Math.log(1.8));
        const td = h('td', 'cell', r, ratio.toFixed(2) + '×');
        td.style.background = `color-mix(in oklab, ${worse ? 'var(--div-pos)' : 'var(--div-neg)'} ${Math.round(k * 85)}%, var(--div-mid))`;
        td.style.color = k > 0.55 ? '#fff' : 'var(--ink)';
        td.title = `You ${fmt.pct(a)} vs industry ${fmt.pct(ii)}`;
      });
    });
  }
  PIQ.views.benchmark = { title: 'Peer Benchmarking', render };
})();

  <script>/* js/views/why.js */
/* Why did it change? — mix / market / member-specific decomposition + What should I do? */
(function () {
  const PIQ = window.PIQ;
  const { h, fmt, ml, state, card, sourceText, pageHead, productStateFilters, select, seg, stateName, prodLong } = PIQ.ui;
  const S = PIQ.sem, D = PIQ.data, C = PIQ.config;
  let t0 = C.policyChangeMonth, dim = null;

  function render(root) {
    const p = state.p, s = state.s, metric = state.dpd;
    const dims = (p === 'ALL' ? [{ id: 'psb', name: 'Product × state × band' }, { id: 'p', name: 'Product' }] : []).concat([{ id: 'sb', name: 'State × band' }, { id: 's', name: 'State' }, { id: 'b', name: 'Risk band' }]);
    if (!dim || !dims.find((x) => x.id === dim)) dim = dims[0].id;
    pageHead(root, 'Why did it change?', 'Every movement in a portfolio metric splits into three causes: you took on a riskier mix, the market got worse, or your own segments did worse than the market. Only the last two need very different responses.');
    const bar = productStateFilters(root, { dpd: true });
    select(bar, 'Compare from', D.MONTHS.slice(0, -1).map((m) => ({ id: m, name: ml(m) + (m === C.policyChangeMonth ? ' (policy change)' : '') })), t0, (v) => { t0 = v; PIQ.go('why'); });
    const tf = h('div', 'field', bar); h('label', null, tf, 'To'); const to = h('div', null, tf, ml(S.latest())); to.style.cssText = 'padding:7px 0;font-weight:600';
    seg(bar, 'Segment by', dims, dim, (v) => { dim = v; PIQ.go('why'); });

    const d = S.decompose({ p, s, t0, t1: S.latest(), dim, metric });
    const nar = PIQ.insights.narrateDecomposition(d);

    const top = h('div', 'grid g-2-1', root);
    const wc = card(top, {
      title: `${S.METRICS[metric].name}: from ${fmt.pct(d.R0)} to ${fmt.pct(d.R1)}`,
      sub: `${prodLong(p)} · ${stateName(s)} · ${ml(t0)} → ${ml(S.latest())}`,
      source: sourceText(['member', 'industry'], 'midpoint mix/rate decomposition; market effect = industry relative change in the same segment'),
      table: () => ({ cols: [{ name: 'Component' }, { name: 'Effect', r: 1 }, { name: 'Share', r: 1 }], rows: [['Start', fmt.pct(d.R0), ''], ['Mix shift', fmt.bps(d.mix), share(d, d.mix)], ['Market-wide change', fmt.bps(d.market), share(d, d.market)], ['Member-specific', fmt.bps(d.own), share(d, d.own)], ['End', fmt.pct(d.R1), '']] })
    });
    PIQ.charts.waterfall(wc.viz, {
      start: { label: ml(t0), value: d.R0 },
      steps: [
        { label: 'Mix shift', value: d.mix, note: 'More balance in riskier segments' },
        { label: 'Market-wide change', value: d.market, note: 'Industry moved the same segments' },
        { label: 'Member-specific', value: d.own, note: 'Your segments vs the market' }
      ],
      end: { label: ml(S.latest()), value: d.R1 },
      fmt: (v) => fmt.pct(v), deltaFmt: (v) => Math.round(v * 10000) + ' bps', upIsBad: true, height: 290
    });

    const nc = h('div', 'card', top);
    h('div', 'stat-label', nc, 'The verdict');
    const v = h('h2', null, nc, nar.verdict);
    v.style.cssText = 'font-size:20px;margin:6px 0 12px;line-height:1.3';
    h('p', null, nc, nar.headline);
    h('p', null, nc, nar.drivers);
    const tot = Math.abs(d.mix) + Math.abs(d.market) + Math.abs(d.own) || 1;
    const sb = h('div', 'split-bar', nc);
    [['Mix', d.mix, 'var(--s1)'], ['Market', d.market, 'var(--s3)'], ['Yours', d.own, 'var(--s2)']].forEach(([n, x, c]) => {
      const sh = Math.abs(x) / tot;
      const segm = h('div', null, sb, sh > 0.3 ? n + ' ' + Math.round(sh * 100) + '%' : sh > 0.1 ? Math.round(sh * 100) + '%' : '');
      segm.title = n;
      segm.style.cssText = `flex:${Math.abs(x) / tot};background:${c}`;
    });
    const how = h('details', null, nc);
    how.style.marginTop = '12px';
    h('summary', 'small muted', how, 'How is this calculated?');
    h('p', 'small muted', how, 'Portfolio rate = Σ (segment share × segment rate). Mix effect = Σ Δshare × average rate. Rate effect = Σ Δrate × average share, then split: "market" is what your segment would have moved had it tracked the industry\'s relative change in that same segment; "member-specific" is the remainder. The three add up exactly to the total change.');
    const ask = h('button', 'btn', nc, '✦ Ask a follow-up');
    ask.style.marginTop = '10px';
    ask.addEventListener('click', () => PIQ.openDrawer(`What is driving the change in ${s === 'ALL' ? 'my portfolio' : D.S[s].name}?`));

    // Segment table
    const segCard = card(root, { title: 'Which segments drove it', sub: 'Top contributors, largest absolute effect first', source: sourceText(['member', 'industry']) });
    segCard.el.style.marginTop = '16px';
    const list = d.segments.slice(0, dim.length > 1 || dim === 's' ? 10 : 6);
    const tw = h('div', 'table-wrap', segCard.viz);
    const t = h('table', 'tbl', tw);
    const hr = h('tr', null, h('thead', null, t));
    ['Segment', 'Share then → now', 'Your rate then → now', 'Industry rate then → now', 'Mix', 'Market', 'Member-specific', 'Total', 'Main driver'].forEach((c, i) => h('th', i ? 'r' : '', hr, c));
    const body = h('tbody', null, t);
    list.forEach((x) => {
      const r = h('tr', null, body);
      h('td', null, r, x.label);
      h('td', 'r', r, fmt.pct(x.w0, 1) + ' → ' + fmt.pct(x.w1, 1));
      h('td', 'r', r, fmt.pct(x.r0) + ' → ' + fmt.pct(x.r1));
      h('td', 'r', r, fmt.pct(x.ir0) + ' → ' + fmt.pct(x.ir1));
      h('td', 'r', r, fmt.bps(x.mix));
      h('td', 'r', r, fmt.bps(x.market));
      h('td', 'r', r, fmt.bps(x.own));
      h('td', 'r', r, fmt.bps(x.total)).style.fontWeight = '600';
      const dl = PIQ.insights.driverLabel(x);
      const td = h('td', 'r', r);
      h('span', 'tag ' + (dl === 'mix' ? 'mix' : dl === 'market' ? 'mkt' : 'own'), td, dl === 'mix' ? 'Mix shift' : dl === 'market' ? 'Market' : 'Member-specific');
    });

    // What should I do?
    h('div', 'section-title', root, 'What should I do?');
    const recs = PIQ.insights.recommendations(p).filter((r) => s === 'ALL' || !r.states.length || r.states.includes(s));
    if (!recs.length) h('div', 'empty card', root, 'No action needed for this slice. Performance is in line with the market.');
    recs.forEach((r, i) => {
      const box = h('div', 'reco', root);
      h('div', 'reco-n', box, String(i + 1));
      const tx = h('div', null, box);
      h('h4', null, tx, r.title);
      h('p', null, tx, r.why);
      const im = h('div', 'impact', tx);
      r.impact.forEach(([k, val, tn]) => { const s1 = h('span', null, im); h('span', 'muted', s1, k + ': '); h('strong', tn, s1, val); });
      const btns = h('div', null, box);
      btns.style.cssText = 'display:flex;flex-direction:column;gap:6px';
      const label = { simulator: 'Simulate →', upload: 'Check channel data →', logins: 'See applications →', benchmark: 'Benchmark →' }[r.action.view] || 'Open →';
      const b = h('button', 'btn primary sm', btns, label);
      b.addEventListener('click', () => PIQ.go(r.action.view, r.action.params));
    });
  }
  function share(d, x) {
    const tot = Math.abs(d.mix) + Math.abs(d.market) + Math.abs(d.own) || 1;
    return Math.round((Math.abs(x) / tot) * 100) + '%';
  }
  PIQ.views.why = { title: 'Why did it change?', render };
})();

(function () {

    lastKey = key;
    const cur = C.currentCutoff[p];
    pageHead(root, 'Policy Simulator', 'Move the score cut-off and see the trade-off between growth and risk before you change policy. Uses your last 90 days of applications and the bad rates observed at each score.');
    const bar = productStateFilters(root, { allProducts: false });
    const sw = h('div', 'slider-wrap', bar);
    const lab = h('label', null, sw);

      S.log('simulate', { p, s, cutoff });

      const k = h('div', 'kpi-compare', kc);

      const line = (name, f, va, vb, goodUp) => {
        h('div', null, k, name);
        h('div', 'v', k, f(va));
        h('div', 'v', k, f(vb));

        const e = h('div', 'v ' + (Math.abs(dlt) < 1e-9 ? '' : (dlt > 0) === goodUp ? 'good' : 'bad'), k, Math.abs(dlt) < 1e-9 ? '—' : (dlt >= 0 ? '+' : '−') + f(Math.abs(dlt)));

      h('p', null, verdict, `You give up ${fmt.int(Math.max(0, a.approvedPerMonth - b.approvedPerMonth))} approvals and avoid ${fmt.cr(Math.max(0, a.expLossCr - b.expLossCr))} of expected loss. Before the Feb loosening (cut-off ${C.previousCutoff[p]}), net contribution here was ${fmt.cr(prev.netCr)}.`);

        annotations: [{ x: cutoff, label: String(cutoff) }]
      });

      // State-level optimum
      const st = card(body, { title: 'Surgical, not blanket: the best cut-off per state', sub: 'A single national cut-off leaves money on the table · states with at least 2% of your applications', source: sourceText(['scores']) });
      st.el.style.marginTop = '16px';
      const prodApps = S.simulate(p, 'ALL', cur, A).apps;
      const rows = D.STATES.filter((x) => S.simulate(p, x.id, cur, A).apps >= prodApps * 0.02).map((x) => {
        const c0 = S.simulate(p, x.id, cur, A);
        let bb = c0;
        for (let c = 640; c <= 780; c += 10) { const r = S.simulate(p, x.id, c, A); if (r.netCr > bb.netCr + 0.02) bb = r; }
        return { x, c0, bb };
      });
      const t = h('table', 'tbl', h('div', 'table-wrap', st.viz));
      const hr = h('tr', null, h('thead', null, t));
      ['State', 'Current cut-off', 'Best cut-off', 'Approvals change', 'Exp. loss change', 'Net change / month', ''].forEach((c, i) => h('th', i && i < 6 ? 'r' : '', hr, c));
      const tb = h('tbody', null, t);
      rows.forEach(({ x, c0, bb }) => {
        const r = h('tr', null, tb);
        h('td', null, r, x.name);
        h('td', 'r', r, String(cur));
        h('td', 'r', r, String(bb.cutoff)).style.fontWeight = bb.cutoff !== cur ? '700' : '400';
        h('td', 'r', r, fmt.chg(bb.approvedPerMonth / c0.approvedPerMonth - 1));
        h('td', 'r ' + (bb.expLossCr < c0.expLossCr ? 'good' : ''), r, bb.cutoff === cur ? '—' : '−' + fmt.cr(c0.expLossCr - bb.expLossCr));
        h('td', 'r ' + (bb.netCr > c0.netCr + 0.01 ? 'good' : ''), r, bb.cutoff === cur ? '—' : '+' + fmt.cr(bb.netCr - c0.netCr));
        const td = h('td', null, r);
        if (bb.cutoff !== cur) {
          const bt = h('button', 'btn sm', td, 'Apply');
          bt.addEventListener('click', () => PIQ.go('simulator', { p, s: x.id, cutoff: bb.cutoff }));
        }
      });

      // Assumptions
      const as = h('details', 'card', body);
      as.style.marginTop = '16px';
      h('summary', null, as, 'Assumptions (editable)');
      const ag = h('div', null, as);
      ag.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-top:12px';
      [['ticket', 'Avg ticket (₹ lakh)', 1], ['yield', 'Yield (annual)', 100], ['cof', 'Cost of funds', 100], ['opex', 'Opex', 100], ['lgd', 'Loss given default', 100]].forEach(([k2, name, mult]) => {
        const f = h('div', 'field', ag);
        h('label', null, f, name + (mult === 100 ? ' %' : ''));
        const i = h('input', null, f);
        i.type = 'number'; i.step = mult === 100 ? '0.5' : '0.1'; i.value = +(A[k2] * mult).toFixed(2);
        i.addEventListener('change', () => { assume[p][k2] = +i.value / mult; draw(); });
      });
      h('p', 'small muted', as, 'Simplified 12-month view for decision support: margin = disbursal × (yield − cost of funds − opex); loss = disbursal × bad rate × LGD. Replace with the member\'s own profitability model in production.');
    };
    rng.addEventListener('input', () => { cutoff = +rng.value; out.textContent = rng.value; draw(); });
    draw();
  }
  PIQ.views.simulator = { title: 'Policy Simulator', render };
})();

(function () {
  const PIQ = window.PIQ;

    const bar = productStateFilters(root);
    seg(bar, 'Risk bands', [{ id: 'ALL', name: 'All bands' }, { id: 'NPSB', name: 'Near-prime + Subprime' }], bands, (v) => { bands = v; PIQ.go('logins'); });

    const c1 = card(g, {

    });

    const recent = D.DAYS.slice(-5), prior = D.DAYS.slice(0, -5);

    // State table

      h('td', 'r', r, fmt.pct(x.mem.recent.apprRate, 1));
      h('td', 'r', r, fmt.pct(x.ind.recent.apprRate, 1));
      h('td', 'r ' + (x.mem.recent.hiEnqShare > x.ind.recent.hiEnqShare * 1.3 ? 'bad' : ''), r, fmt.pct(x.mem.recent.hiEnqShare, 0));
      h('td', 'r', r, fmt.pct(x.ind.recent.hiEnqShare, 0));

      const td = h('td', 'r', r);
      if (flag) { const sp = h('span', 'tag own', td, '⚠ Investigate'); sp.title = 'Volume surge + high enquiry intensity'; }
      else h('span', 'muted', td, 'Normal');
    });
    if (s !== 'ALL') h('div', 'small muted', sc.body, 'Showing all states for context; the filter above applies to the charts.');
  }
  PIQ.views.logins = { title: 'Login & Application Pulse', render };
})();

  <script>/* js/views/upload.js */
/* Bring Your Data — upload a member file, map fields, join with industry, get new insights. */
(function () {
  const PIQ = window.PIQ;
  const { h, fmt, ml, card, sourceText, pageHead } = PIQ.ui;
  const S = PIQ.sem, D = PIQ.data;
  let parsed = null, mapping = null, step = 1, fileName = '';

  const FIELDS = [
    { id: 'month', name: 'Month (YYYY-MM)', req: true, guess: /month|period|date/i },
    { id: 'product', name: 'Product', req: true, guess: /product/i },
    { id: 'state', name: 'State', req: true, guess: /state|region/i },
    { id: 'band', name: 'Risk band', req: true, guess: /band|tier|risk/i },
    { id: 'bal', name: 'Balance (₹ Cr)', req: true, guess: /^bal|balance(?!.*dpd)|outstanding/i },
    { id: 'd30', name: '30+ DPD balance (₹ Cr)', req: true, guess: /dpd|delinq/i },
    { id: 'dim', name: 'New dimension to analyse', req: false, guess: /channel|source|branch|segment|campaign/i }
  ];

  function parseCSV(text) {
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some((x) => x !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some((x) => x !== '')) rows.push(row);
    const head = rows.shift().map((x) => x.trim());
    return { head, rows };
  }
  const norm = (x) => String(x || '').trim().toLowerCase();
  const findState = (v) => D.STATES.find((s) => norm(s.name) === norm(v) || norm(s.id) === norm(v));
  const findBand = (v) => D.BANDS.find((b) => norm(b.name) === norm(v) || norm(b.id) === norm(v));
  const findProd = (v) => D.PRODUCTS.find((p) => norm(p.id) === norm(v) || norm(p.name) === norm(v) || norm(p.long) === norm(v));

  function autoMap(head) {
    const used = new Set(), m = {};
    FIELDS.forEach((f) => {
      const idx = head.findIndex((c, i) => !used.has(i) && f.guess.test(c));
      if (idx >= 0) { m[f.id] = idx; used.add(idx); }
    });
    return m;
  }

  // Join uploaded rows to industry: expected DPD if each row performed at the industry rate of its segment
  function analyse() {
    const recs = [];
    let unmatched = 0;
    parsed.rows.forEach((r) => {
      const st = findState(r[mapping.state]), bd = findBand(r[mapping.band]), pr = findProd(r[mapping.product]);
      const m = String(r[mapping.month]).trim().slice(0, 7);
      const bal = parseFloat(r[mapping.bal]), d30 = parseFloat(r[mapping.d30]);
      if (!st || !bd || !pr || !D.MONTHS.includes(m) || !isFinite(bal) || !isFinite(d30)) { unmatched++; return; }
      const indRate = S.value('industry', 'dpd30', { p: pr.id, s: st.id, b: bd.id, m });
      recs.push({ m, p: pr.id, s: st.id, b: bd.id, dim: mapping.dim != null ? String(r[mapping.dim]).trim() : 'All', bal, d30, exp: bal * indRate });
    });
    const out = { recs, unmatched, months: [...new Set(recs.map((r) => r.m))].sort() };
    PIQ.uploaded = { name: fileName, dimName: mapping.dim != null ? parsed.head[mapping.dim] : null, ...out };
    S.log('upload.analyse', { file: fileName, rows: recs.length });
    return out;
  }
  function groupBy(recs, keyFn) {
    const g = {};
    recs.forEach((r) => { const k = keyFn(r); const a = (g[k] = g[k] || { bal: 0, d30: 0, exp: 0 }); a.bal += r.bal; a.d30 += r.d30; a.exp += r.exp; });
    return g;
  }
  PIQ.uploadInsights = function () {
    const U = PIQ.uploaded;
    if (!U) return null;
    const last = U.months[U.months.length - 1];
    const L = U.recs.filter((r) => r.m === last);
    const byDim = groupBy(L, (r) => r.dim);
    const cells = groupBy(L, (r) => r.dim + '|' + r.s + '|' + (r.b === 'NP' || r.b === 'SB' ? 'NPSB' : 'PRIME'));
    const worst = Object.entries(cells).filter(([, a]) => a.bal > 20).map(([k, a]) => ({ k, idx: a.d30 / a.exp, a })).sort((x, y) => y.idx - x.idx)[0];
    return { last, byDim, worst };
  };

  function render(root) {
    pageHead(root, 'Bring Your Data', 'Upload a file with fields the bureau doesn\'t hold, such as sourcing channel, campaign, branch or collection agency. The platform joins it to industry benchmarks so you can see how each slice performs against the market, like for like.');
    const steps = h('div', 'steps', root);
    ['Upload', 'Map fields', 'Validate', 'Insights'].forEach((n, i) => { const s = h('div', 'step' + (step === i + 1 ? ' on' : ''), steps); h('b', null, s, String(i + 1)); h('span', null, s, n); });
    const privacy = h('div', 'callout okay', root);
    privacy.style.marginBottom = '16px';
    h('h4', null, privacy, '🔒 Your file never leaves this browser');
    h('p', null, privacy, 'In this prototype, parsing and joining happen on your device. In production, uploads live in the member\'s private tenant: they are encrypted, never pooled into industry data, and never visible to other members.');

    if (step === 1) {
      const drop = h('label', 'drop', root);
      h('div', null, drop, '⇪').style.fontSize = '28px';
      h('div', null, drop, 'Drop a CSV here or click to browse');

/*
 * Governed AI analyst engine.
 *
 * Two layers:
 *  1. TOOLS — the only way the analyst can touch data. Each returns an answer (text + chart +
 *     sources) and `facts` (a compact, pre-formatted summary that an LLM may phrase, never compute).
 *  2. A deterministic intent router — understands the question, applies guardrails, keeps
 *     conversational context, and calls the tools. Works fully offline. When an approved LLM is
 *     connected (see llm.js), the LLM chooses the tools instead, but the guardrails still run first.
 */
(function () {
  const PIQ = window.PIQ;
  const S = PIQ.sem, D = PIQ.data, C = PIQ.config;
  const F = () => PIQ.ui.fmt;
  const ml = (m) => D.monthLabel(m);
  const sName = (s) => (!s || s === 'ALL' ? 'all states' : D.S[s].name);
  const pName = (p) => (!p || p === 'ALL' ? 'total portfolio' : D.P[p].name.toLowerCase());
  const pTitle = (p) => (!p || p === 'ALL' ? 'All products' : D.P[p].name);
  const pLong = (p) => (!p || p === 'ALL' ? 'Total portfolio (all products)' : D.P[p].long);
  const mName = (m) => S.METRICS[m].name;
  const mLow = (m) => mName(m).replace(/^[A-Z][a-z]/, (c) => c.toLowerCase());
  // change in a metric: bps for delinquency, pp for cure rate, % for amounts
  const dfmt = (m, now, was) => (S.METRICS[m].unit !== 'pct' ? F().chg(now / was - 1) : m === 'cure' ? F().pp(now - was, 1) : F().bps(now - was));
  const fmtM = (m, v) => F().metric(m, v);
  const src = (...k) => k.map((x) => S.DATASETS[x].name);

  // ---------------- tools ----------------
  const tools = {};
  function def(name, description, props, required, fn) {
    tools[name] = { name, description, schema: { type: 'object', properties: props, required: required || [], additionalProperties: false }, run: fn };
  }
  const P_PRODUCT = { type: 'string', enum: ['ALL'].concat(D.PRODUCTS.map((x) => x.id)), description: 'ALL = whole portfolio; ' + D.PRODUCTS.map((x) => x.id + ' = ' + x.long).join('; ') };
  const P_STATE = { type: 'string', enum: ['ALL'].concat(D.STATES.map((x) => x.id)), description: 'ALL or a state code: ' + D.STATES.map((x) => x.id + ' = ' + x.name).join('; ') };
  const P_METRIC = { type: 'string', enum: Object.keys(S.METRICS), description: 'bal, acc, orig, dpd30, dpd90, cure' };

  def('trend', 'Monthly trend of a metric for the industry and/or the member, optionally for one or more states, a risk band or a lender type.', {
    metric: P_METRIC, product: P_PRODUCT, states: { type: 'array', items: P_STATE }, band: { type: 'string', enum: ['SP', 'PP', 'PR', 'NP', 'SB'] },
    lender: { type: 'string', enum: D.LENDERS.map((l) => l.id), description: 'Lender category: ' + D.LENDERS.map((l) => l.id + ' = ' + l.long).join('; ') }, who: { type: 'string', enum: ['industry', 'member', 'both'] }
  }, ['metric', 'product'], (a) => {
    const metric = a.metric || 'dpd30', p = a.product || 'ALL';
    const states = a.states && a.states.length ? a.states : ['ALL'];
    const who = a.who || 'industry';
    const t = S.latest(), t12 = S.monthsAgo(12), t6 = S.monthsAgo(6);
    const series = [], facts = { metric: mName(metric), product: pLong(p), asOf: ml(t) };
    const colors = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];
    const paras = [];
    let ci = 0;
    const band = a.band ? D.B[a.band].name + ' ' : '';
    const lender = a.lender ? D.L[a.lender].name + ' ' : '';
    states.forEach((s) => {
      const f = { p, s, b: a.band || null, l: a.lender || null };
      if (who !== 'member') {
        const pts = S.series('industry', metric, f);
        const now = pts[pts.length - 1].y, y12 = pts[pts.length - 13].y, y6 = pts[pts.length - 7].y;
        const label = (states.length > 1 ? sName(s).replace('all states', 'All states') : 'Industry') + (who === 'both' && states.length > 1 ? ' (industry)' : '');
        series.push({ name: label, color: who === 'both' && states.length === 1 ? 'var(--s3)' : colors[ci++ % 4], points: pts });
        const ch = dfmt(metric, now, y12);
        const ch6 = dfmt(metric, now, y6);
        paras.push(`**${lender}${band}${pTitle(p)} · ${sName(s)}**: industry ${mLow(metric)} is **${fmtM(metric, now)}** in ${ml(t)}, ${ch} year-on-year (${ch6} over 6 months).`);
        facts['industry_' + s] = { now: fmtM(metric, now), yoy: ch, sixMonth: ch6 };
      }
      if (who !== 'industry') {
        const pts = S.series('member', metric, { p, s, b: a.band || null });
        const now = pts[pts.length - 1].y, y12 = pts[pts.length - 13].y;
        series.unshift({ name: C.member.name + (states.length > 1 ? ' · ' + sName(s) : ''), color: states.length > 1 ? colors[ci++ % 4] : 'var(--s1)', points: pts });
        const ch = dfmt(metric, now, y12);
        paras.push(`**${C.member.name} · ${sName(s)}**: ${fmtM(metric, now)}, ${ch} year-on-year.`);
        facts['member_' + s] = { now: fmtM(metric, now), yoy: ch };
      }
    });
    if (metric === 'bal' && who !== 'member') {
      const g = D.STATES.map((x) => ({ n: x.name, g: S.value('industry', 'bal', { p, s: x.id, m: t }) / S.value('industry', 'bal', { p, s: x.id, m: t12 }) - 1 })).sort((x, y) => y.g - x.g);
      paras.push(`Fastest-growing state: **${g[0].n}** (${F().chg(g[0].g)}); slowest: ${g[g.length - 1].n} (${F().chg(g[g.length - 1].g)}).`);
    }
    return {
      answer: {
        paras,
        chart: (el) => PIQ.charts.line(el, { series, xLabel: ml, yFmt: (v) => fmtM(metric, v), yTickFmt: F().metricTick(metric), height: 220, endLabels: series.length <= 3, zero: S.METRICS[metric].unit !== 'pct' }),
        sources: src(who === 'industry' ? 'industry' : 'member', 'industry'),
        filters: `${pLong(p)} · ${states.map(sName).join(' vs ')}${band ? ' · ' + band : ''}${lender ? ' · ' + lender : ''} · ${ml(D.MONTHS[0])}–${ml(t)}`,
        followups: who === 'industry'
          ? ['Now compare it with my portfolio', 'Which state has the highest ' + (metric === 'bal' ? 'growth' : 'delinquency') + '?', 'Why did my ' + pName(p) + ' delinquency go up?']
          : ['Why did it change?', 'How do I compare with peers?', 'What should I do about it?']
      },
      facts
    };
  });

  def('rank_states', 'Rank all states on a metric (latest month), for the industry or the member, with the change over 12 months.', {
    metric: P_METRIC, product: P_PRODUCT, who: { type: 'string', enum: ['industry', 'member'] }, growth: { type: 'boolean', description: 'rank by YoY growth instead of level' }, band: { type: 'string', enum: ['SP', 'PP', 'PR', 'NP', 'SB'] }
  }, ['metric', 'product'], (a) => {
    const metric = a.metric || 'dpd30', p = a.product || 'ALL', who = a.who || 'industry';
    const t = S.latest(), t12 = S.monthsAgo(12);
    const rows = D.STATES.map((x) => {
      const now = S.value(who, metric, { p, s: x.id, b: a.band || null, m: t }), was = S.value(who, metric, { p, s: x.id, b: a.band || null, m: t12 });
      return { s: x, now, was, g: now / was - 1, d: now - was };
    });
    const key = a.growth ? 'g' : 'now';
    rows.sort((x, y) => y[key] - x[key]);
    const f = (r) => (a.growth ? F().chg(r.g) : fmtM(metric, r.now));
    const top = rows[0], bot = rows[rows.length - 1];
    const what = (a.growth ? mLow(metric) + ' growth' : mLow(metric)) + (a.band ? ' (' + D.B[a.band].name + ')' : '');
    return {
      answer: {
        paras: [`Highest ${what}: **${top.s.name}** at **${f(top)}**. Lowest: **${bot.s.name}** at ${f(bot)}.`,
          S.METRICS[metric].unit === 'pct' && metric !== 'cure' ? `The biggest 12-month move was in **${rows.slice().sort((x, y) => Math.abs(y.d) - Math.abs(x.d))[0].s.name}** (${F().bps(rows.slice().sort((x, y) => Math.abs(y.d) - Math.abs(x.d))[0].d)}).` : ''].filter(Boolean),
        chart: (el) => PIQ.charts.bars(el, { items: rows.map((r) => ({ label: r.s.name, value: a.growth ? r.g : r.now })), fmt: a.growth ? (v) => F().chg(v) : (v) => fmtM(metric, v), color: 'var(--s1)' }),
        sources: src(who),
        filters: `${pLong(p)} · ${who === 'member' ? C.member.name : 'industry'} · ${ml(t)}`,
        followups: [`What is driving the change in ${top.s.name}?`, `What is happening in ${top.s.name}?`, 'How do I compare with peers?']
      },
      facts: { ranking: rows.map((r) => ({ state: r.s.name, value: f(r) })) }
    };
  });

  def('lender_types', 'Compare the 8 lender categories (' + D.LENDERS.map((l) => l.name).join(', ') + ') on a metric in the industry.', { metric: P_METRIC, product: P_PRODUCT, state: P_STATE }, ['metric', 'product'], (a) => {
    const metric = a.metric || 'dpd30', p = a.product || 'ALL', s = a.state || 'ALL';
    const colors = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
    const series = D.LENDERS.map((l, i) => ({ name: l.name, color: colors[i], points: S.series('industry', metric, { p, s, l: l.id }) }));
    const now = series.map((x) => ({ n: x.name, v: x.points[x.points.length - 1].y, v12: x.points[x.points.length - 13].y }));
    const unit = S.METRICS[metric].unit;
    return {
      answer: {
        paras: [now.map((x) => `**${x.n}** ${fmtM(metric, x.v)} (${dfmt(metric, x.v, x.v12)} YoY)`).join(' · '),
          (() => { const by = now.slice().sort((x, y) => y.v - x.v); const hi = S.METRICS[metric].bad ? by[0] : by[by.length - 1], lo = S.METRICS[metric].bad ? by[by.length - 1] : by[0]; return metric.startsWith('dpd') || metric === 'cure' ? `Weakest: **${hi.n}**. Strongest: **${lo.n}**.` : ''; })()].filter(Boolean),
        chart: (el) => PIQ.charts.line(el, { series, xLabel: ml, yFmt: (v) => fmtM(metric, v), yTickFmt: F().metricTick(metric), height: 220 }),
        sources: src('industry'), filters: `${pLong(p)} · ${sName(s)} · by lender type`,
        followups: ['How do I compare with PVT mid-size peers?', 'Is the industry taking more risk in personal loans?']
      },
      facts: { byLender: now.map((x) => ({ lender: x.n, value: fmtM(metric, x.v) })) }
    };
  });

  def('band_mix', 'Balance mix by risk band over time for the industry or the member.', { product: P_PRODUCT, state: P_STATE, who: { type: 'string', enum: ['industry', 'member'] } }, ['product'], (a) => {
    const p = a.product || 'ALL', s = a.state || 'ALL', who = a.who || 'industry';
    const months = D.MONTHS.filter((_, i) => i % 3 === 2);
    const cols = ['var(--r1)', 'var(--r2)', 'var(--r3)', 'var(--r4)', 'var(--r5)'];
    const stacks = D.BANDS.map((b, i) => ({ name: b.name, color: cols[i], values: months.map((m) => S.value(who, 'bal', { p, s, b: b.id, m })) }));
    const share = (m, ids) => ids.reduce((acc, id) => acc + S.value(who, 'bal', { p, s, b: id, m }), 0) / S.value(who, 'bal', { p, s, m });
    const now = share(S.latest(), ['NP', 'SB']), was = share(S.monthsAgo(12), ['NP', 'SB']);
    return {
      answer: {
        paras: [`Near-prime + subprime make up **${F().pct(now, 1)}** of ${who === 'member' ? 'your' : 'industry'} ${pName(p)} balance in ${sName(s)}, versus ${F().pct(was, 1)} a year ago (${F().pp(now - was, 1)}).`,
          now - was > 0.01 ? 'Risk appetite has increased: the mix is tilting towards weaker bands.' : 'The risk mix is broadly stable.'],
        chart: (el) => PIQ.charts.stacked(el, { x: months, xLabel: ml, stacks, height: 200 }),
        sources: src(who), filters: `${pLong(p)} · ${sName(s)}`,
        followups: ['How is subprime performing in personal loans?', 'Is the rise in my delinquency me or the market?']
      },
      facts: { nearPrimeSubprimeShareNow: F().pct(now, 1), yearAgo: F().pct(was, 1) }
    };
  });

  const peerFromText = (id) => S.PEER_GROUPS.find((g) => g.id === id) || S.PEER_GROUPS[0];
  def('benchmark', 'Compare the member with a peer group and the industry on a metric. Peer groups are privacy-checked (min 5 institutions, no institution above 25%).', {
    metric: P_METRIC, product: P_PRODUCT, state: P_STATE, peer_group: { type: 'string', enum: S.PEER_GROUPS.map((g) => g.id) }
  }, ['product'], (a) => {
    const metric = a.metric || 'dpd30', p = a.product || 'ALL', s = a.state || 'ALL';
    const g = peerFromText(a.peer_group || PIQ.ui.state.peer);
    const f = { p, s };
    const mS = S.series('member', metric, f), iS = S.series('industry', metric, f), pS = S.peerSeries(g.id, metric, f);
    const m = mS[mS.length - 1].y, i = iS[iS.length - 1].y, pv = pS.suppressed ? null : pS.points[pS.points.length - 1].y;
    const m6 = mS[mS.length - 7].y, i6 = iS[iS.length - 7].y, p6 = pS.suppressed ? null : pS.points[pS.points.length - 7].y;
    const bad = S.METRICS[metric].bad;
    const better = (x, y) => (bad ? x < y : x > y);
    const paras = [`Your ${pName(p)} ${mLow(metric)} in ${sName(s)} is **${fmtM(metric, m)}** (${dfmt(metric, m, m6)} in 6 months).`];
    if (pS.suppressed) paras.push(`⚠ The **${g.name}** benchmark is suppressed: ${pS.check.reason}`);
    const gap = (x, y) => (metric === 'cure' ? Math.abs((x - y) * 100).toFixed(1) + ' pp' : Math.abs(Math.round((x - y) * 10000)) + ' bps');
    if (!pS.suppressed) paras.push(`**${g.name}** (${pS.check.n} institutions): ${fmtM(metric, pv)} (${dfmt(metric, pv, p6)}). You are **${gap(m, pv)} ${better(m, pv) ? 'better' : 'worse'}** than peers.`);
    paras.push(`Industry: ${fmtM(metric, i)} (${dfmt(metric, i, i6)}). You are ${better(m, i) ? 'better' : 'worse'} than the market by ${gap(m, i)}.`);
    if (!pS.suppressed && Math.abs(m - m6) > Math.abs(pv - p6) * 1.8 && m > m6 && bad) paras.push(`Your trend is the issue: you are deteriorating **${((m - m6) / Math.max(pv - p6, 0.0001)).toFixed(1)}× faster** than peers.`);
    return {
      answer: {
        paras,
        chart: (el) => PIQ.charts.line(el, { series: [{ name: C.member.name, color: 'var(--s1)', points: mS }, { name: 'Peers', color: 'var(--s2)', points: pS.points }, { name: 'Industry', color: 'var(--s3)', points: iS }], xLabel: ml, yFmt: (v) => fmtM(metric, v), yTickFmt: F().metricTick(metric), height: 220, endLabels: true }),
        sources: src('member', 'peers', 'industry'), filters: `${pLong(p)} · ${sName(s)} · peer group: ${g.name}`,
        followups: ['Why did it change?', 'Where am I worse than the market?', 'What should I do about it?'],
        refusal: false
      },
      facts: { member: fmtM(metric, m), peers: pS.suppressed ? 'suppressed: ' + pS.check.reason : fmtM(metric, pv), industry: fmtM(metric, i), member6mChange: dfmt(metric, m, m6), peer6mChange: pS.suppressed ? null : dfmt(metric, pv, p6) }
    };
  });

  def('where_differ', 'Find the state × risk band cells where the member performs better or worse than the industry, like for like.', {
    product: P_PRODUCT, metric: P_METRIC, direction: { type: 'string', enum: ['better', 'worse'] }
  }, ['product'], (a) => {
    const p = a.product || 'ALL', metric = a.metric || 'dpd30', dir = a.direction || 'worse';
    const t = S.latest();
    const cells = [];
    D.STATES.forEach((x) => D.BANDS.forEach((b) => {
      const m = S.value('member', metric, { p, s: x.id, b: b.id, m: t }), i = S.value('industry', metric, { p, s: x.id, b: b.id, m: t });
      cells.push({ label: x.name + ' · ' + b.name, m, i, r: m / i, bal: S.value('member', 'bal', { p, s: x.id, b: b.id, m: t }) });
    }));
    const bad = S.METRICS[metric].bad;
    cells.sort((x, y) => ((dir === 'worse') === bad ? y.r - x.r : x.r - y.r));
    const top = cells.slice(0, 5);
    return {
      answer: {
        paras: [`Where you are **${dir}** than the market (${mLow(metric)}, same state and risk band, ${ml(t)}):`],
        bullets: top.map((c) => `**${c.label}**: ${fmtM(metric, c.m)} vs industry ${fmtM(metric, c.i)} (${c.r.toFixed(2)}×) on ${F().cr(c.bal)}`),
        chart: (el) => PIQ.charts.bars(el, { items: top.map((c) => ({ label: c.label, value: c.m, ref: c.i })), fmt: (v) => fmtM(metric, v), color: 'var(--s1)', valueName: 'You', refName: 'Industry' }),
        sources: src('member', 'industry'), filters: `${pLong(p)} · like-for-like cells`,
        followups: ['Why did it change?', 'What should I do about it?']
      },
      facts: { cells: top.map((c) => ({ cell: c.label, member: fmtM(metric, c.m), industry: fmtM(metric, c.i) })) }
    };
  });

  def('explain_change', 'Decompose the change in the member\'s delinquency into mix shift, market-wide change and member-specific performance, with top contributing segments.', {
    product: P_PRODUCT, state: P_STATE, metric: { type: 'string', enum: S.DPD_METRICS }, from_month: { type: 'string', description: 'YYYY-MM, default 2026-02 (policy change)' }

        sources: src('member', 'industry'), filters: `${pLong(p)} · ${sName(s)} · ${ml(t0)} → ${ml(S.latest())}`,
        followups: ['What should I do about it?', s === 'ALL' ? 'What is driving the change in Gujarat?' : 'What if I raise my cut-off to 700 in ' + D.S[s].name + '?', ],

    };
  });

  def('recommend', 'Ranked, quantified recommended actions (cut-off changes, sourcing audits, early-warning checks, collections, growth).', {
    product: P_PRODUCT, state: P_STATE, focus: { type: 'string', enum: ['all', 'collections', 'growth', 'policy'] }
  }, [], (a) => {

  def('simulate_cutoff', 'Simulate a score cut-off: approval rate, approvals, expected bad rate, expected loss and net contribution vs the current policy. Use cutoff 0 to find the profit-maximising cut-off.', {
    product: P_PRODUCT, state: P_STATE, cutoff: { type: 'integer', description: '600–800; 0 = find best' }
  }, ['product'], (a) => {
    const p = !a.product || a.product === 'ALL' ? 'PL' : a.product, s = a.state || 'ALL'; // cut-offs are product-specific
    const cur = C.currentCutoff[p];
    let c = a.cutoff || 0;
    if (!c) { const curve = S.simulateCurve(p, s); c = curve.reduce((m, r) => (r.netCr > m.netCr ? r : m), curve[0]).cutoff; }
    c = Math.max(600, Math.min(800, Math.round(c / 10) * 10));
    const A = S.simulate(p, s, cur), B = S.simulate(p, s, c);
    S.log('simulate', { p, s, cutoff: c }, 'ai');
    const gain = B.netCr - A.netCr;
    const curve = S.simulateCurve(p, s);
    return {
      answer: {
        paras: [`Moving the ${pName(p)} cut-off in **${sName(s)}** from ${cur} to **${c}**:`, a.cutoff ? '' : `(${c} is the profit-maximising cut-off for this slice.)`].filter(Boolean),
        bullets: [
          `Approval rate ${F().pct(A.approvalRate, 1)} → **${F().pct(B.approvalRate, 1)}** (${F().chg(B.approvedPerMonth / A.approvedPerMonth - 1)} approvals)`,
          `Expected bad rate ${F().pct(A.badRate)} → **${F().pct(B.badRate)}**`,
          `Expected credit loss ${F().cr(A.expLossCr)} → **${F().cr(B.expLossCr)}** a month`,
          `Net contribution ${F().cr(A.netCr)} → **${F().cr(B.netCr)}** a month (${gain >= 0 ? '+' : '−'}${F().cr(Math.abs(gain))})`
        ],
        chart: (el) => PIQ.charts.line(el, { series: [{ name: 'Net contribution (₹ Cr / month)', color: 'var(--s1)', points: curve.map((r) => ({ x: r.cutoff, y: r.netCr })), marks: [c] }], xNumeric: true, xLabel: (x) => String(x), yFmt: F().cr, yTickFmt: (v) => v.toFixed(0), height: 190, area: true, annotations: [{ x: cur, label: 'Current ' + cur }] }),
        sources: src('scores'), filters: `${pLong(p)} · ${sName(s)} · last 90 days of applications`,
        followups: s === 'ALL' ? ['What is the best cut-off for Gujarat?', 'What if I raise my cut-off to 700 in Uttar Pradesh?'] : ['What is the best cut-off for Maharashtra?', 'What should I do about it?'],
        link: { view: 'simulator', params: { p, s, cutoff: c } }
      },
      facts: { current: { cutoff: cur, approvalRate: F().pct(A.approvalRate, 1), badRate: F().pct(A.badRate), expLossPerMonth: F().cr(A.expLossCr), netPerMonth: F().cr(A.netCr) }, proposed: { cutoff: c, approvalRate: F().pct(B.approvalRate, 1), badRate: F().pct(B.badRate), expLossPerMonth: F().cr(B.expLossCr), netPerMonth: F().cr(B.netCr) } }
    };

  def('application_pulse', 'Last 5 days vs prior 25 days of the member\'s applications/logins vs the industry: volume change, approval rate, share of applicants with 3+ enquiries, and where any surge comes from.', {

  // ---------------- guardrails ----------------
  const OTHER_LENDERS = /\b(hdfc|icici|sbi|state bank|axis|kotak|bajaj|idfc|yes bank|indusind|federal bank|bank of baroda|\bbob\b|pnb|punjab national|canara|au small|tata capital|paytm|kreditbee|navi|moneyview|competitor'?s?|name (the|my|your) peers|who are (my|the) peers|list (of |the )?peers|which (banks|lenders|nbfcs|institutions) are in)\b/i;
  const PERSONAL = /\b(pan( number)?|aadhaar|aadhar|borrower named|customer named|mobile number|phone number|account number|date of birth|address of)\b/i;
  const OUT_OF_SCOPE = /\b(share price|stock price|stocks?|nifty|sensex|repo rate|inflation|gdp|weather|cricket|bitcoin|crypto|forecast the rbi|election|mutual fund)\b/i;

  function guard(q) {
    if (OTHER_LENDERS.test(q)) return {
      refusal: true, paras: ['I can\'t share data about any named or identifiable lender. Tenant isolation means you can only see **your own portfolio**, **anonymised peer aggregates** (at least 5 institutions, none above 25% of the group) and **industry totals**.', 'I can compare you with an anonymised peer group instead.'],
      sources: ['Governance policy: tenant isolation'], filters: 'Request blocked', followups: ['How do I compare with PVT mid-size peers?', 'Where am I worse than the market?'], guard: 'tenant-isolation'
    };
    if (PERSONAL.test(q)) return {
      refusal: true, paras: ['I don\'t have access to borrower-level or personal information. This platform works only with aggregated, non-personal portfolio and industry data, in line with CICRA and DPDP principles.'],
      sources: ['Governance policy: no personal data'], filters: 'Request blocked', followups: ['Which segments show deterioration?'], guard: 'personal-data'
    };
    if (OUT_OF_SCOPE.test(q)) return {
      refusal: true, paras: ['That\'s outside the approved datasets I can answer from, so I won\'t guess. I cover industry credit data, your portfolio, anonymised peers, applications and score distributions.'],
      sources: ['Scope control'], filters: 'Out of scope', followups: ['Which datasets can you answer from?', 'What is happening in personal loans?'], guard: 'scope'
    };
    return null;
  }

  // ---------------- entity extraction ----------------
  function extract(q) {
    const t = q.toLowerCase();
    const e = {};
    const PRODS = [['PL', /personal loan|\bpl\b|personal/], ['CC', /credit card|\bcards?\b|\bcc\b/],
      ['HL', /home loan|housing loan|\bhl\b|mortgage/], ['LAP', /\blap\b|loan against property|property loan/],
      ['AL', /auto loan|car loan|vehicle loan|\bauto\b/], ['TW', /two.?wheeler|\btw\b|bike loan/], ['GL', /gold/],
      ['MSME', /\bmsmes?\b|\bsmes?\b|small business|business loan/], ['AGRI', /\bagri|farm|kisan|\bkcc\b|crop|tractor/],
      ['MFL', /micro.?finance(?! institution)|micro.?loan|\bjlg\b/]];
    const found = PRODS.filter(([, re]) => re.test(t)).map(([id]) => id);
    if (/\b(products|portfolio|book|overall|whole)\b/.test(t) && !found.length) e.product = 'ALL';
    if (found.length > 1) e.products = found;
    if (found.length) e.product = found[0];
    const states = [];
    D.STATES.forEach((s) => { const n = s.name.toLowerCase().replace(/ \(nct\)| states/g, ''); if (t.includes(n)) states.push({ s: s.id, i: t.indexOf(n) }); });
    [['NE', /north.?east|assam|meghalaya|manipur|mizoram|nagaland|tripura|sikkim|arunachal/], ['DL', /\bdelhi\b|\bncr\b|gurgaon|gurugram/], ['JK', /kashmir|\bj&k\b/],
      ['OD', /orissa/], ['UT', /\buts?\b|union territor|ladakh|andaman|lakshadweep|puducherry|pondicherry|chandigarh/]]
      .forEach(([id, re]) => { const m = t.match(re); if (m && !states.find((x) => x.s === id)) states.push({ s: id, i: m.index }); });
    ['MH', 'TN', 'KA', 'UP', 'GJ', 'TG', 'AP', 'MP', 'WB', 'RJ', 'KL', 'PB', 'DL', 'BR'].map((id) => [id, new RegExp('\\b' + id + '\\b')]).concat([['TG', /\btelengana\b/i]]).forEach(([id, re]) => { const m = q.match(re); if (m && !states.find((x) => x.s === id)) states.push({ s: id, i: m.index }); });
    if (/\bmumbai\b|\bpune\b/.test(t)) states.push({ s: 'MH', i: 0 });
    if (/\bchennai\b/.test(t)) states.push({ s: 'TN', i: 0 });
    if (/\bbengaluru\b|\bbangalore\b/.test(t)) states.push({ s: 'KA', i: 0 });
    if (/\bahmedabad\b|\bsurat\b/.test(t)) states.push({ s: 'GJ', i: 0 });
    if (/\bhyderabad\b/.test(t)) states.push({ s: 'TG', i: 0 });
    if (/\blucknow\b|\bnoida\b/.test(t)) states.push({ s: 'UP', i: 0 });
    e.states = states.sort((a, b) => a.i - b.i).map((x) => x.s);
    if (/national|all states|overall|india|country/.test(t)) e.national = true;
    if (/super.?prime/.test(t)) e.band = 'SP';
    else if (/prime.?plus/.test(t)) e.band = 'PP';
    else if (/near.?prime/.test(t) && /sub.?prime/.test(t)) e.bandPair = true;
    else if (/near.?prime/.test(t)) e.band = 'NP';
    else if (/sub.?prime/.test(t)) e.band = 'SB';
    const LT = [['PSU', /\bpsus?\b|public sector/], ['PVT', /\bpvts?\b|private (sector )?banks?/], ['NBFC', /\bnbfcs?\b/], ['FIN', /fintech/],
      ['SFB', /\bsfbs?\b|small finance/], ['MFI', /\bmfis?\b|micro.?finance institution/], ['RRB', /\brrbs?\b|\bdccbs?\b|regional rural|co-?operative bank/], ['HFC', /\bhfcs?\b|housing finance/]];
    e.lenders = LT.filter(([, re]) => re.test(t)).map(([id]) => id);
    if (/180\+|180 plus|180 dpd|180 days/.test(t)) e.metric = 'dpd180';
    else if (/90\+|90 plus|90 dpd|\bnpa\b/.test(t)) e.metric = 'dpd90';
    else if (/cure|collection/.test(t)) e.metric = 'cure';
    else if (/30\+|delinquen|\bdpd\b|risk|deteriorat|bad rate|stress/.test(t)) e.metric = 'dpd30';
    else if (/originat|disburs/.test(t)) e.metric = 'orig';
    else if (/growth|growing|balance|book size|outstanding|\bsize\b/.test(t)) e.metric = 'bal';
    else if (/accounts/.test(t)) e.metric = 'acc';
    const cm = t.match(/\b(5[5-9]\d|[6-8]\d\d)\b/);
    if (cm) e.cutoff = +cm[1];
    e.self = /\b(my|me|i|mine|our|we|us|i'm|am i|portfolio)\b/.test(t);
    if (/since feb|february/.test(t)) e.from = '2026-02';
    else if (/last (6|six) months/.test(t)) e.from = S.monthsAgo(6);
    else if (/last year|12 months|yoy|this year/.test(t)) e.from = S.monthsAgo(12);
    const pvt = e.lenders.includes('PVT');
    if (pvt && /mid/.test(t)) e.peer = 'mid-pvt';
    else if (pvt && /large/.test(t)) e.peer = 'large-pvt';
    else if (pvt && /\ball\b/.test(t)) e.peer = 'all-pvt';
    else if (e.lenders.length === 1 && /benchmark|peer|against|compare/.test(t)) e.peer = { PVT: 'all-pvt', PSU: 'psu', NBFC: 'nbfc', FIN: 'fin', SFB: 'sfb', MFI: 'mfi', RRB: 'rrb', HFC: 'hfc' }[e.lenders[0]];
    return e;
  }

  // ---------------- intent routing ----------------
  const ctx = { product: 'ALL', state: 'ALL', metric: 'dpd30', intent: null, who: 'industry' };
  function route(q) {
    const t = q.toLowerCase().trim();
    const e = extract(q);
    const followUp = /^(and|now|what about|how about|same|compare (that|it|this)|and for|then)\b/.test(t) || /\b(that|it)\b/.test(t) && t.split(' ').length < 9;
    const p = e.product || (followUp ? ctx.product : 'ALL');
    const st = e.states.length ? e.states[0] : followUp ? ctx.state : 'ALL';
    const metric = e.metric || (followUp ? ctx.metric : null);

    const call = (name, args) => ({ name, args });
    if (/which datasets|what can you|what can i ask|^help\b|what data/.test(t)) return call('datasets', {});
    if (/open the printable|open the board/.test(t)) return { name: 'nav', args: { view: 'brief' } };
    if (!/mix|trend|happening/.test(t) && /defin|meaning|^what('s| is) (a |the )?(30\+|90\+|cure rate|dpd|near.?prime|sub.?prime|super.?prime|prime.?plus|mix effect|market effect|risk band)/.test(t)) {
      const term = /cure/.test(t) ? 'cure' : /90/.test(t) ? 'dpd90' : /30|dpd/.test(t) ? 'dpd30' : /mix/.test(t) ? 'mix' : /market effect/.test(t) ? 'market' : /prime|band/.test(t) ? 'bands' : 'dpd30';
      return call('define', { term });
    }
    if (/upload|my file|sourcing channel|\bchannel|\bdsa\b/.test(t)) return call('uploaded_insight', {});
    if (/worry|alert|early.?warning|attention|concern|red flag/.test(t)) return call('alerts', {});
    if (/board|summary|summari[sz]e|brief/.test(t)) return call('board_summary', {});
    if (/cut.?off|cutoff|what if|simulat|tighten|loosen/.test(t)) return call('simulate_cutoff', { product: p, state: st, cutoff: /best|optimal|optimum|ideal/.test(t) ? 0 : e.cutoff || 0 });
    if (/application|login|enquir|inquir|applicant|approval rate|this week/.test(t)) return call('application_pulse', { product: p, state: st, bands: /surge|coming from/.test(t) ? 'near_prime_subprime' : e.bandPair ? 'near_prime_subprime' : 'all' });
    if (/what should i do|recommend|action|what to do|where should|what do you suggest|how (do|can) i fix|\bgrow my/.test(t) || /what should .* do/.test(t))
      return call('recommend', { product: /credit card|card/.test(t) && /grow/.test(t) ? 'CC' : p, state: e.states[0] || 'ALL', focus: /collection/.test(t) ? 'collections' : /grow/.test(t) ? 'growth' : 'all' });
    if (/band mix|risk band mix|risk mix|taking more risk|mix of/.test(t)) return call('band_mix', { product: p, state: st, who: e.self ? 'member' : 'industry' });
    if (/(growth|growing).*(versus|vs|against|compared|than)/.test(t)) return call('market_share', { product: e.product, state: st });
    if (/why|driv|reason|cause|contribut|which segments|me or the market|explain|how much of the change|what changed|open the full analysis/.test(t)) {
      if (/open the full/.test(t)) return { name: 'nav', args: { view: 'why' } };
      return call('explain_change', { product: p, state: st, metric: S.DPD_METRICS.includes(metric) ? metric : 'dpd30', from_month: e.from });
    }
    if (/better than the market|worse than the market|where am i (better|worse)|outperform|underperform/.test(t)) return call('where_differ', { product: p, metric: metric || 'dpd30', direction: /better|outperform/.test(t) ? 'better' : 'worse' });
    if (/market share|gaining share|\bshare\b/.test(t)) return call('market_share', { product: e.products ? undefined : e.product, state: st });
    if (/peer|benchmark|how do i compare|how am i|how is my|performing against|versus the industry|vs (the )?industry|compared? (with|to|it with) my|against the industry|my portfolio|compare my/.test(t) || (followUp && e.self && /compare/.test(t)))
      return call('benchmark', { metric: metric === 'bal' || metric === 'orig' || !metric ? 'dpd30' : metric, product: p, state: st, peer_group: e.peer });
    const lenders = e.lenders;
    if (lenders.length >= 2 || (lenders.length === 1 && /perform|compare|lenders|how are/.test(t) && !e.self)) {
      if (lenders.length === 1) return call('trend', { metric: metric || 'dpd30', product: p, states: [st], lender: lenders[0], who: 'industry' });
      return call('lender_types', { metric: metric || 'dpd30', product: p, state: st });
    }
    if (/which state|which region|states|regions|fastest|highest|lowest|weakest|strongest|rank|significant changes/.test(t) && e.states.length < 2)
      return call('rank_states', { metric: /growth|growing|fastest/.test(t) && !/deteriorat/.test(t) ? 'bal' : metric || 'dpd30', product: p, who: e.self ? 'member' : 'industry', growth: /growth|growing|fastest/.test(t) && !/deteriorat/.test(t), band: e.band });
    // comparisons across states / follow-ups
    if (e.states.length >= 2) return call('trend', { metric: metric || 'dpd30', product: p, states: e.states, who: e.self ? 'member' : 'industry' });
    if (e.states.length === 1 && (e.national || (followUp && /compare/.test(t)))) {
      const base = e.national ? 'ALL' : ctx.state && ctx.state !== e.states[0] ? ctx.state : 'ALL';
      return call('trend', { metric: metric || ctx.metric || 'dpd30', product: p, states: [base, e.states[0]], who: e.self ? 'member' : 'industry' });
    }
    if (e.product || e.products || e.metric || e.states.length || /happening|trend|industry|market|how is|how are/.test(t)) {
      if (e.products && /gaining|share/.test(t)) return call('market_share', { state: st });
      return call('trend', { metric: metric || (/happening|what is going on/.test(t) ? 'dpd30' : 'dpd30'), product: p, states: [st], band: e.band, lender: e.lenders[0], who: e.self ? 'both' : 'industry' });
    }
    if (followUp && ctx.intent) return call(ctx.intent, Object.assign({}, ctx.args || {}));
    return null;
  }

  // ---------------- public API ----------------
  function run(name, args, by) {
    const tool = tools[name];
    if (!tool) throw new Error('Unknown tool ' + name);
    S.log('ai.' + name, args, by || 'ai');
    const out = tool.run(args || {});
    // remember context for follow-ups
    const a = args || {};
    if (a.product) ctx.product = a.product;
    if (a.state) ctx.state = a.state;
    if (a.states && a.states.length) ctx.state = a.states[a.states.length - 1];
    if (a.metric) ctx.metric = a.metric;
    ctx.intent = name; ctx.args = a;
    out.answer.tools = [{ name, args: a }];
    return out;
  }

  function answer(q) {
    const g = guard(q);
    if (g) { S.log('ai.guardrail', { rule: g.guard, q: q.slice(0, 80) }, 'ai'); return { answer: g, facts: { refused: g.guard } }; }
    const r = route(q);
    if (!r) return {
      answer: { paras: ['I\'m not sure I understood. I answer questions about industry credit trends, your portfolio, peer benchmarks, why metrics changed, policy simulations and application trends. Try one of these:'], sources: [], filters: '', followups: ['What should I worry about this week?', 'What is happening in personal loans?', 'Why did my personal loan delinquency go up?'] },
      facts: {}
    };
    if (r.name === 'nav') { PIQ.go(r.args.view); return { answer: { paras: ['Opening the full analysis…'], sources: [], filters: '' }, facts: {} }; }
    return run(r.name, r.args, 'ai');
  }

  PIQ.agent = { tools, answer, run, guard, route, extract, ctx };
})();

</script>
  <script>/* js/agent/llm.js */
/*
 * Approved-LLM mode. The browser never holds an API key: it talks to the local/enterprise gateway
 * (server.js → /api/llm), which forwards to whichever LLM the organisation has approved.
 *
 * The LLM only (1) chooses which governed tools to call and (2) phrases the answer. Every number
 * comes from tool results. Guardrails run before the LLM is ever called.
 */
(function () {
  const PIQ = window.PIQ;
  const C = PIQ.config;
  let statusP = null;

  function status() {
    if (statusP) return statusP;
    if (location.protocol === 'file:') return (statusP = Promise.resolve({ ok: false }));
    statusP = fetch(C.llmEndpoint + '/status').then((r) => (r.ok ? r.json() : { ok: false })).catch(() => ({ ok: false }));
    return statusP;
  }

  const SYSTEM = () => `You are the AI analyst inside ${C.productName}, a credit-bureau intelligence platform. You are talking to ${C.member.user}, ${C.member.role} at ${C.member.name} (a ${C.member.type.toLowerCase()} in India).

Rules:
- Answer ONLY using the provided tools. Call a tool for every factual claim. Never calculate, estimate or invent numbers; quote figures exactly as the tools return them.
- If no tool can answer, say the information is not in the approved datasets. Do not guess.
- Never reveal or speculate about any other named lender, peer institution or individual borrower.
- Keep answers short and decision-oriented: 2–4 sentences or up to 5 bullets. Lead with the answer, then the "so what".
- Use Indian conventions (₹ crore, lakh). Use **bold** for the key number. No headings.
- Data is synthetic demo data as of ${C.dataAsOf}; applications to ${C.loginsAsOf}. Codes: products PL/CC; states MH, TN, KA, UP, GJ, TG or ALL.`;

  async function post(body) {
    const r = await fetch(C.llmEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('LLM gateway ' + r.status + ': ' + (await r.text()).slice(0, 200));
    return r.json();
  }

  // history: [{role:'user'|'assistant', text}]
  async function ask(question, history) {
    const tools = Object.values(PIQ.agent.tools).map((t) => ({ name: t.name, description: t.description, input_schema: t.schema }));
    const messages = history.slice(-8).map((m) => ({ role: m.role, content: m.text }));
    messages.push({ role: 'user', content: question });
    let last = null;
    const used = [];
    for (let i = 0; i < 5; i++) {
      const res = await post({ system: SYSTEM(), messages, tools, max_tokens: 16000 });
      if (res.stop_reason === 'refusal') throw new Error('refusal');
      const content = res.content || [];
      const calls = content.filter((b) => b.type === 'tool_use');
      if (res.stop_reason === 'tool_use' && calls.length) {
        messages.push({ role: 'assistant', content });
        const results = calls.map((c) => {
          try {
            const out = PIQ.agent.run(c.name, c.input || {}, 'llm');
            last = out.answer; used.push({ name: c.name, args: c.input });
            return { type: 'tool_result', tool_use_id: c.id, content: JSON.stringify(out.facts) };
          } catch (e) {
            return { type: 'tool_result', tool_use_id: c.id, content: 'Error: ' + e.message, is_error: true };
          }
        });
        messages.push({ role: 'user', content: results }); // all results in one message
        continue;
      }
      const text = content.filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim();
      const base = last || { sources: [], filters: '', followups: [] };
      return Object.assign({}, base, { paras: text.split(/\n\s*\n/).filter(Boolean), bullets: null, tools: used, llm: true });
    }
    throw new Error('Too many tool rounds');
  }

  PIQ.llm = { status, ask };
})();

</script>
  <script>/* js/views/analyst.js */
/* AI Analyst — chat UI (full page + drawer share one conversation). */
(function () {
  const PIQ = window.PIQ;
  const { h, pageHead } = PIQ.ui;
  const C = PIQ.config;
  const convo = []; // {role, q?} | {role:'bot', a}
  const history = []; // text history for the LLM
  const mounts = [];

  // Safe inline formatting: **bold** only; everything else is text
  function rich(parent, text, tag) {
    const el = h(tag || 'p', null, parent);
    String(text).split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) h('strong', null, el, part.slice(2, -2));
      else if (part) el.appendChild(document.createTextNode(part));
    });
    return el;
  }

  function renderBot(log, a) {
    const wrap = h('div', 'msg bot', log);
    const b = h('div', 'bot-bubble' + (a.refusal ? ' refusal' : ''), wrap);
    (a.paras || []).forEach((p) => {
      const lines = p.split('\n');
      if (lines.every((l) => /^\s*([-•*]|\d+\.)\s+/.test(l))) {
        const ul = h('ul', null, b);
        lines.forEach((l) => rich(ul, l.replace(/^\s*([-•*]|\d+\.)\s+/, ''), 'li'));
      } else rich(b, p);
    });
    if (a.bullets && a.bullets.length) { const ul = h('ul', null, b); a.bullets.forEach((x) => rich(ul, x, 'li')); }
    if (a.chart) { const v = h('div', 'viz', b); v.style.marginTop = '8px'; try { a.chart(v); } catch (e) { v.textContent = ''; } }
    const meta = h('div', 'bot-meta', wrap);
    if (a.sources && a.sources.length) { const s = h('span', 'src-chip', meta); h('b', null, s, '⛁ Source: '); s.appendChild(document.createTextNode(a.sources.join(' + '))); }
    if (a.filters) { const s = h('span', 'src-chip', meta); h('b', null, s, 'Filters: '); s.appendChild(document.createTextNode(a.filters)); }
    if (a.tools && a.tools.length) { const s = h('span', 'src-chip', meta); h('b', null, s, 'Tools: '); s.appendChild(document.createTextNode(a.tools.map((t) => t.name).join(', '))); s.title = a.tools.map((t) => t.name + ' ' + JSON.stringify(t.args)).join('\n'); }
    if (a.refusal) { const s = h('span', 'src-chip', meta); h('b', null, s, '🔐 Guardrail applied'); }
    if (a.llm) { const s = h('span', 'src-chip', meta); s.textContent = '✦ phrased by approved LLM · numbers from governed tools'; }
    const fu = h('div', 'follow', wrap);
    if (a.link) { const bt = h('button', 'chip', fu, '↗ Open in dashboard'); bt.addEventListener('click', () => { document.getElementById('drawer').classList.remove('open'); PIQ.go(a.link.view, a.link.params); }); }
    (a.actions || []).forEach((x) => { const bt = h('button', 'chip', fu, '↗ ' + x.label); bt.addEventListener('click', () => { document.getElementById('drawer').classList.remove('open'); PIQ.go(x.view, x.params); }); });
    (a.followups || []).forEach((q) => { const bt = h('button', 'chip', fu, q); bt.addEventListener('click', () => ask(q)); });
  }

  function renderAll() {
    for (let i = mounts.length - 1; i >= 0; i--) if (!mounts[i].log.isConnected && !mounts[i].compact) mounts.splice(i, 1);
    mounts.forEach((m) => {
      if (!m.log.isConnected) return;
      m.log.innerHTML = '';
      if (!convo.length) welcome(m.log);
      convo.forEach((x) => {
        if (x.role === 'user') h('div', 'msg user', m.log, x.q);
        else if (x.role === 'typing') { const w = h('div', 'msg bot', m.log); const b = h('div', 'bot-bubble', w); const t = h('span', 'typing', b); h('i', null, t); h('i', null, t); h('i', null, t); h('span', 'muted small', b, '  querying governed datasets…'); }
        else renderBot(m.log, x.a);
      });
      m.log.scrollTop = m.log.scrollHeight;
      if (m.ctx) {
        const c = PIQ.agent.ctx;
        m.ctx.innerHTML = '';
        h('span', null, m.ctx, 'Context:');
        [PIQ.ui.prodName(c.product), PIQ.ui.stateName(c.state), PIQ.sem.METRICS[c.metric].short].forEach((x) => h('span', 'tag', m.ctx, x));
        h('span', 'muted', m.ctx, '· follow-ups keep this context');
      }
    });
  }
  function welcome(log) {
    const w = h('div', 'msg bot', log);
    const b = h('div', 'bot-bubble', w);
    rich(b, `Hi ${C.member.user.split(' ')[0]}, I'm your ${C.productName} analyst. Ask me anything about the market, your portfolio, peers, applications or "what if" policies. Every number I give you comes from the approved datasets, with its source shown.`);
    const fu = h('div', 'follow', w);
    ['What should I worry about this week?', 'What is happening in personal loans?', 'Why did my personal loan delinquency go up?', 'Show me HDFC\'s delinquency'].forEach((q) => { const bt = h('button', 'chip', fu, q); bt.addEventListener('click', () => ask(q)); });
  }

  let busy = false;
  async function ask(q) {
    q = String(q || '').trim();
    if (!q || busy) return;
    busy = true;
    convo.push({ role: 'user', q });
    convo.push({ role: 'typing' });
    renderAll();
    let result;
    const g = PIQ.agent.guard(q);
    const st = await PIQ.llm.status();
    await new Promise((r) => setTimeout(r, g ? 250 : 450));
    try {
      if (!g && st.ok) result = await PIQ.llm.ask(q, history);
    } catch (e) {
      console.warn('LLM unavailable, using governed engine:', e.message);
    }
    if (!result) result = PIQ.agent.answer(q).answer;
    convo.pop();
    convo.push({ role: 'bot', a: result });
    history.push({ role: 'user', text: q }, { role: 'assistant', text: (result.paras || []).concat(result.bullets || []).join('\n').replace(/\*\*/g, '') || '(chart)' });
    busy = false;
    renderAll();
  }

  function mount(container, opts) {
    const main = h('div', 'chat-main', container);
    main.style.flex = '1';
    const ctx = h('div', 'context-bar', main);
    const log = h('div', 'chat-log', main);
    const form = h('form', 'chat-input', main);
    const inp = h('input', null, form);
    inp.placeholder = 'Ask about the market, your portfolio, peers, applications…';
    inp.setAttribute('aria-label', 'Ask a question');
    const send = h('button', 'btn primary', form, 'Ask');
    send.type = 'submit';
    form.addEventListener('submit', (e) => { e.preventDefault(); const q = inp.value; inp.value = ''; ask(q); });
    mounts.push({ log, ctx, inp, compact: opts && opts.compact });
    renderAll();
    return inp;
  }

  function render(root) {
    pageHead(root, 'AI Analyst', 'Ask in plain English. The analyst picks the right governed tools, shows its sources, and remembers context for follow-ups like "compare that with Gujarat" or "now compare it with my portfolio".');
    const wrap = h('div', 'chat', root);
    const left = h('div', null, wrap);
    left.style.cssText = 'display:flex;min-height:0';
    const inp = mount(left, {});
    const side = h('div', 'chat-side', wrap);
    const total = PIQ.questions.reduce((a, c) => a + c.qs.length, 0);
    const hd = h('div', null, side);
    h('strong', null, hd, 'Question library');
    h('div', 'small muted', hd, `${total} ready-made questions · click to ask`);
    PIQ.questions.forEach((cat, i) => {
      const d = h('details', 'qcat', side);
      if (i < 2) d.open = true;
      const s = h('summary', null, d);
      h('h4', null, s, cat.cat).style.display = 'inline';
      cat.qs.forEach((q) => { const b = h('button', 'chip', d, q); b.addEventListener('click', () => ask(q)); });
    });
    setTimeout(() => inp.focus(), 50);
  }

  PIQ.chatUI = { mount, ask };
  PIQ.views.analyst = { title: 'AI Analyst', render };
})();

</script>
  <script>/* js/app.js */
/* App shell: navigation, header, routing, theme, AI drawer. */
(function () {
  const { h, state, onState } = PIQ.ui;
  const C = PIQ.config;
  const NAV = [
    { sec: 'Intelligence' },
    { id: 'overview', name: 'Command Centre', ico: '◎' },
    { id: 'industry', name: 'Industry Intelligence', ico: '▦' },
    { id: 'benchmark', name: 'Peer Benchmarking', ico: '⇆' },
    { sec: 'Decide' },
    { id: 'why', name: 'Why did it change?', ico: '◈', tag: 'new' },
    { id: 'simulator', name: 'Policy Simulator', ico: '⚙' },
    { id: 'logins', name: 'Login & Application Pulse', ico: '⚡', tag: 'new' },
    { sec: 'Ask & extend' },
    { id: 'analyst', name: 'AI Analyst', ico: '✦' },
    { id: 'upload', name: 'Bring Your Data', ico: '⇪' },
    { id: 'brief', name: 'Board Brief', ico: '▤' },
    { sec: 'Trust' },
    { id: 'governance', name: 'Governance & Trust', ico: '⛨' }
  ];
  let current = 'overview';
  PIQ.routeParams = {};

  function buildSide() {
    const side = document.getElementById('side');
    side.innerHTML = '';
    const b = h('div', 'brand', side);
    h('div', 'brand-mark', b, 'IQ');
    const t = h('div', null, b);
    h('div', 'brand-name', t, C.productName);
    h('div', 'brand-tag', t, C.tagline);
    const alerts = PIQ.sem.alerts().filter((a) => a.sev === 'critical' || a.sev === 'serious').length;
    NAV.forEach((n) => {
      if (n.sec) { h('div', 'nav-sec', side, n.sec); return; }
      const a = h('button', 'nav-item' + (n.id === current ? ' active' : ''), side);
      a.type = 'button';
      h('span', 'ico', a, n.ico);
      h('span', null, a, n.name);
      if (n.id === 'overview' && alerts) h('span', 'nav-badge', a, String(alerts));
      if (n.tag) h('span', 'nav-new', a, n.tag);
      a.addEventListener('click', () => go(n.id));
    });
    h('div', 'side-foot', side, 'Prototype · synthetic data only. No real bureau or member data is used.');
  }

  function buildTop() {
    const top = document.getElementById('top');
    top.innerHTML = '';
    const v = PIQ.views[current];
    const t = h('div', null, top);
    h('div', 'top-title', t, v.title);
    h('div', 'top-sub', t, C.member.name + ' · ' + C.member.type);
    const r = h('div', 'top-right', top);
    h('span', 'pill warn', r, '● Synthetic demo data');
    h('span', 'pill', r, 'Data as of ' + C.dataAsOf);
    const llm = h('span', 'pill', r, 'AI: governed engine');
    llm.id = 'llm-pill';
    PIQ.llm.status().then((s) => { if (s.ok) { llm.textContent = 'AI: ' + s.label; llm.className = 'pill ok'; } });
    const theme = h('button', 'icon-btn', r, '◐');
    theme.type = 'button';
    theme.title = 'Toggle light / dark';
    theme.addEventListener('click', () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('piq-theme', root.dataset.theme); } catch (e) { /* storage unavailable */ }
      render();
    });
    const who = h('div', 'avatar', r, C.member.user.split(' ').map((x) => x[0]).join(''));
    who.title = C.member.user + ' — ' + C.member.role;
  }

  function render() {
    const view = document.getElementById('view');
    view.innerHTML = '';
    PIQ.charts.hideTip();
    PIQ.views[current].render(view, PIQ.routeParams || {});
  }

  function go(id, params) {
    current = id;
    PIQ.routeParams = params || {};
    if (params && params.p) state.p = params.p;
    if (params && params.s) state.s = params.s;
    try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ }
    buildSide(); buildTop(); render();
    document.getElementById('fab').style.display = id === 'analyst' ? 'none' : '';
    window.scrollTo(0, 0);
  }
  PIQ.go = go;
  onState(() => { PIQ.routeParams = {}; render(); });

  // Drawer: the AI analyst available from every page
  function setupDrawer() {
    const drawer = document.getElementById('drawer');
    const head = h('div', 'drawer-head', drawer);
    h('strong', null, head, '✦ Ask ' + C.productName);
    h('span', 'muted small', head, 'answers only from approved datasets');
    const full = h('button', 'btn sm', head, 'Full screen');
    full.style.marginLeft = 'auto';
    full.type = 'button';
    const close = h('button', 'icon-btn', head, '✕');
    close.type = 'button';
    close.setAttribute('aria-label', 'Close');
    const box = h('div', null, drawer);
    box.style.cssText = 'flex:1;display:flex;min-height:0';
    PIQ.chatUI.mount(box, { compact: true });
    const open = () => drawer.classList.add('open');
    const shut = () => drawer.classList.remove('open');
    document.getElementById('fab').addEventListener('click', open);
    close.addEventListener('click', shut);
    full.addEventListener('click', () => { shut(); go('analyst'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') shut(); });
    PIQ.openDrawer = (q) => { open(); if (q) PIQ.chatUI.ask(q); };
  }

  try { const t = localStorage.getItem('piq-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ignore */ }
  const start = (location.hash || '').slice(1);
  setupDrawer();
  go(PIQ.views[start] ? start : 'overview');
})();
