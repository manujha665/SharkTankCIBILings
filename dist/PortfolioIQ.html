<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="PortfolioIQ prototype: credit & lending intelligence with a governed AI analyst. Synthetic demo data." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PortfolioIQ — Credit Intelligence</title>
  <style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --page: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #6f6e69;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.1);
  --nav: #0f2340;
  --nav-ink: #c9d4e5;
  --nav-active: #1d3a63;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --s1: #2a78d6; /* member */
  --s2: #eb6834; /* peers */
  --s3: #1baf7a; /* industry */
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #4a3aa7;
  --s8: #e34948;
  --st-good: #0ca30c;
  --st-warning: #fab219;
  --st-serious: #ec835a;
  --st-critical: #d03b3b;
  --good-ink: #006300;
  --bad-ink: #b3261e;
  --div-neg: #256abf;
  --div-pos: #d03b3b;
  --div-mid: #f0efec;
  --r1: #86b6ef; --r2: #5598e7; --r3: #2a78d6; --r4: #1c5cab; --r5: #104281; /* ordinal risk-band ramp */
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  --radius: 12px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme='light'])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #a3a29a; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.1);
    --nav: #0a1628; --nav-ink: #b6c3d8; --nav-active: #172c4b;
    --accent: #3987e5; --accent-ink: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c; --bad-ink: #e66767;
    --div-neg: #3987e5; --div-pos: #e66767; --div-mid: #383835;
    --r1: #184f95; --r2: #256abf; --r3: #3987e5; --r4: #6da7ec; --r5: #9ec5f4;
    --shadow: none;
  }
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #a3a29a; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.1);
  --nav: #0a1628; --nav-ink: #b6c3d8; --nav-active: #172c4b;
  --accent: #3987e5; --accent-ink: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c; --bad-ink: #e66767;
  --div-neg: #3987e5; --div-pos: #e66767; --div-mid: #383835;
  --r1: #184f95; --r2: #256abf; --r3: #3987e5; --r4: #6da7ec; --r5: #9ec5f4;
  --shadow: none;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.good { color: var(--good-ink); }
.bad { color: var(--bad-ink); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { background: var(--nav); color: var(--nav-ink); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #3987e5, #1baf7a); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
.brand-name { color: #fff; font-weight: 700; font-size: 16px; }
.brand-tag { font-size: 11px; opacity: 0.75; }
.nav-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.55; padding: 14px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--nav-ink); text-decoration: none; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; font-size: 13.5px; }
.nav-item:hover { background: rgba(255, 255, 255, 0.06); }
.nav-item.active { background: var(--nav-active); color: #fff; font-weight: 600; }
.nav-item .ico { width: 18px; text-align: center; opacity: 0.9; }
.nav-badge { margin-left: auto; font-size: 10.5px; background: #d03b3b; color: #fff; border-radius: 99px; padding: 1px 7px; font-weight: 600; }
.nav-new { margin-left: auto; font-size: 10px; background: rgba(27, 175, 122, 0.25); color: #7fe0bb; border-radius: 99px; padding: 1px 7px; font-weight: 600; }
.side-foot { margin-top: auto; font-size: 11px; opacity: 0.6; padding: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
.top-title { font-size: 17px; font-weight: 600; }
.top-sub { font-size: 12px; color: var(--ink-3); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); white-space: nowrap; }
.pill.warn { background: rgba(250, 178, 25, 0.14); border-color: rgba(250, 178, 25, 0.4); }
.pill.ok { background: rgba(12, 163, 12, 0.1); border-color: rgba(12, 163, 12, 0.35); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

.content { padding: 22px 28px 60px; max-width: 1440px; width: 100%; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; }
.page-head p { margin: 4px 0 0; color: var(--ink-3); max-width: 760px; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 0 0 18px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
.field label { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.field select, .field input[type='number'], .field input[type='text'] { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); min-height: 34px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

/* ---------- cards & grid ---------- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-1-2 { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.9fr); }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.card-head h3 { font-size: 14.5px; }
.card-head .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.card-tools { margin-left: auto; display: flex; gap: 6px; }
.source { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 8px; }
.source::before { content: '⛁'; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 22px 0 10px; font-weight: 600; }

/* stat tiles */
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 12px; color: var(--ink-3); }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.stat-delta { font-size: 12px; }
.stat-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.stat-value { white-space: nowrap; }
.hero { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }

/* callouts */
.callout { border-radius: 10px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border); }
.callout.insight { border-left: 3px solid var(--accent); }
.callout.danger { border-left: 3px solid var(--st-critical); }
.callout.okay { border-left: 3px solid var(--st-good); }
.callout h4 { font-size: 13.5px; margin-bottom: 4px; }
.callout p { margin: 0; color: var(--ink-2); }

/* alerts */
.alert { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--grid); }
.alert:last-child { border-bottom: 0; }
.sev { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.sev.critical { background: var(--st-critical); }
.sev.serious { background: var(--st-serious); }
.sev.warning { background: var(--st-warning); color: #111; }
.sev.good { background: var(--st-good); }
.alert-title { font-weight: 600; font-size: 13.5px; }
.alert-detail { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.sev-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--ink-3); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 8px; border-bottom: 1px solid var(--axis); }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.r { white-space: nowrap; }
.tbl tr:hover td { background: var(--surface-2); }
.heat td.cell { text-align: center; font-weight: 500; border: 2px solid var(--surface); border-radius: 6px; }
.table-wrap { overflow-x: auto; }

/* ---------- charts ---------- */
.viz { width: 100%; min-height: 60px; position: relative; }
.viz-svg { display: block; overflow: visible; }
.viz-grid { stroke: var(--grid); stroke-width: 1; }
.viz-base { stroke: var(--axis); stroke-width: 1; }
.viz-tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.viz-label { fill: var(--ink-2); font-size: 12px; }
.viz-val { fill: var(--ink); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.viz-end-val { fill: var(--ink); font-size: 12px; font-weight: 600; }
.viz-end-name { fill: var(--ink-3); font-size: 11px; }
.viz-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz-dot { stroke: var(--surface); stroke-width: 2; }
.viz-bar { transition: opacity 0.12s; cursor: default; outline: none; }
.viz-bar.hover, .viz-bar:focus { opacity: 0.8; }
.viz-cross { stroke: var(--axis); stroke-width: 1; }
.viz-annot { stroke: var(--ink-3); stroke-width: 1; opacity: 0.6; }
.viz-annot-text { fill: var(--ink-3); font-size: 11px; }
.viz-ref { stroke: var(--ink-2); stroke-width: 2; stroke-linecap: round; }
.viz-range { stroke: var(--grid); stroke-width: 4; stroke-linecap: round; }
.viz-connector { stroke: var(--axis); stroke-width: 1; }
.viz-spark-line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; font-size: 12px; color: var(--ink-2); }
.viz-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.viz-legend-key.line { width: 14px; height: 2px; border-radius: 2px; }
.viz-legend-key.rect { width: 10px; height: 10px; border-radius: 3px; }
.viz-legend-key.dot { width: 10px; height: 10px; border-radius: 50%; }
.viz-tip { position: fixed; z-index: 100; display: none; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14); font-size: 12px; min-width: 140px; }
.viz-tip-title { color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
.viz-tip-row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.viz-tip-row strong { font-variant-numeric: tabular-nums; }
.viz-tip-key { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.viz-tip-key.rect { width: 9px; height: 9px; border-radius: 2px; }
.viz-tip-name { color: var(--ink-3); }

/* ---------- decomposition ---------- */
.split-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 8px 0 6px; }
.split-bar > div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11.5px; font-weight: 600; min-width: 2px; }
.split-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.split-legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.reco > :last-child { align-self: start; }
.reco { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
.reco-n { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
.reco h4 { font-size: 14px; margin-bottom: 3px; }
.reco p { margin: 0; color: var(--ink-2); font-size: 13px; }
.reco .impact { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); }
.tag.mkt { background: rgba(27, 175, 122, 0.12); }
.tag.own { background: rgba(208, 59, 59, 0.1); }
.tag.mix { background: rgba(42, 120, 214, 0.1); }

/* ---------- simulator ---------- */
.slider-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 280px; flex: 1; }
input[type='range'] { width: 100%; accent-color: var(--accent); }
.kpi-compare { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 16px; align-items: baseline; font-size: 13px; }
.kpi-compare .h { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.kpi-compare .v { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- AI analyst ---------- */
.chat { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; height: calc(100vh - 150px); min-height: 520px; }
.chat-main { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-height: 0; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 9px 14px; border-radius: 14px 14px 4px 14px; }
.msg.bot { align-self: flex-start; width: 92%; }
.bot-bubble { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 12px 14px; }
.bot-bubble p { margin: 0 0 8px; }
.bot-bubble p:last-child { margin-bottom: 0; }
.bot-bubble ul { margin: 4px 0 8px; padding-left: 18px; }
.bot-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.src-chip { font-size: 11px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.src-chip b { color: var(--ink-2); font-weight: 600; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.chat-input input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.chat-side { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; overflow-y: auto; min-height: 0; }
.qcat { margin-bottom: 12px; }
.qcat h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); margin: 8px 0 6px; display: flex; justify-content: space-between; }
.qcat .chip { display: block; width: 100%; border-radius: 8px; margin-bottom: 5px; }
.context-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink-3); align-items: center; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: 0.2s; }
.typing i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
.refusal { border-left: 3px solid var(--st-critical); }

/* drawer */
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 30; background: var(--nav); color: #fff; border: 0; border-radius: 99px; padding: 12px 18px; font-weight: 600; box-shadow: 0 8px 24px rgba(15, 35, 64, 0.35); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--page); border-left: 1px solid var(--border); z-index: 40; transform: translateX(100%); transition: transform 0.22s ease; display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0, 0, 0, 0.12); }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 8px; }
.drawer .chat-main { border-radius: 0; border: 0; flex: 1; }

/* upload */
.drop { border: 2px dashed var(--axis); border-radius: 12px; padding: 28px; text-align: center; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: rgba(42, 120, 214, 0.05); }
.map-row { display: grid; grid-template-columns: 180px 1fr 1fr; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.steps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.step { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.step b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); font-size: 11px; }
.step.on { color: var(--ink); font-weight: 600; }
.step.on b { background: var(--accent); color: #fff; border-color: var(--accent); }

/* brief */
.brief { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 48px; }
.brief h1 { font-size: 26px; }
.brief h2 { font-size: 16px; margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--grid); }
.brief p, .brief li { color: var(--ink-2); line-height: 1.6; }

/* governance */
.guard { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--grid); }
.guard-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(42, 120, 214, 0.1); font-size: 18px; }
.guard h4 { font-size: 14px; }
.guard p { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; }
code, .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 12px; }

.empty { padding: 30px; text-align: center; color: var(--ink-3); }
.suppressed { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: rgba(250, 178, 25, 0.1); border: 1px solid rgba(250, 178, 25, 0.35); font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3, .g-2-1, .g-1-2 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  .chat { grid-template-columns: minmax(0, 1fr); height: auto; }
  .chat-main { height: 70vh; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
  .brand-tag, .nav-sec, .side-foot { display: none; }
  .nav-item { white-space: nowrap; width: auto; }
  .content { padding: 16px; }
  .top { padding: 10px 16px; flex-wrap: wrap; position: static; }
  .top-right { margin-left: 0; flex-wrap: wrap; width: 100%; }
  .side { max-width: 100vw; }
  .brand { padding: 4px 8px; }
  .filters { padding: 10px; }
  .field { min-width: 0; }
  .reco { grid-template-columns: 30px 1fr; }
  .reco > :last-child { grid-column: 2; }
  .kpi-compare { font-size: 12px; gap: 6px 10px; }
  .map-row { grid-template-columns: 1fr; }
  .g2, .g4 { grid-template-columns: minmax(0, 1fr); }
  .brief { padding: 24px 18px; }
}

/* ---------- print (board brief) ---------- */
@media print {
  .side, .top, .fab, .drawer, .no-print { display: none !important; }
  .app { display: block; }
  body { background: #fff; }
  .content { padding: 0; }
  .brief { border: 0; padding: 0; max-width: none; }
  .card { box-shadow: none; break-inside: avoid; }
}

  <script>/* js/data.js */
/*
 * Synthetic data engine. Everything here is fabricated for demonstration and is
 * deterministic (seeded), so the demo tells the same story every time.
 *
 * Storage: dense "cubes" (typed arrays) so any slice sums fast.
 *  industry : month x product x state x riskBand x lenderCategory
 *  member   : month x product x state x riskBand
 *  peers    : peer x month x product x state            (never shown individually)
 *  logins   : who x day x product x state x riskBand   (industry + member)
 *  scores   : product x state x 20-pt score bin (member applications, last 90 days)
 *
 * Amounts are stored as sums (balance, DPD balances, ...) so any slice aggregates
 * correctly: rate = sum(numerator) / sum(denominator).
 *
 * Embedded story (member = Sahyadri Bank, a mid-size private bank, all products):
 *  - PL cut-off loosened 700 -> 680 in Feb 2026; origination mix shifts to near-prime /
 *    subprime, mostly in Uttar Pradesh and Gujarat. PL and MSME also grow faster than the
 *    rest of the book, so the whole portfolio's mix gets riskier.
 *  - Uttar Pradesh: the market itself is deteriorating AND the member added risk.
 *  - Gujarat: the market is benign; the member's deterioration is idiosyncratic (DSA sourcing).
 *  - Microfinance: a market-wide stress cycle (strongest in Bihar, Odisha, West Bengal...).
 *  - Last 5 days of logins: near-prime / subprime PL applications in UP & GJ spike, with
 *    high enquiry intensity — an early-warning signal before it shows up in DPD.
 *  - Credit cards: member is better than peers.
 */
(function (root) {
  const PIQ = (root.PIQ = root.PIQ || {});

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20261004);
  const noise = (amp) => 1 + (rng() * 2 - 1) * amp;

  // ---------------- dense cube with cached slice sums ----------------
  // dims: [[key, ids[]], ...]; filters: key -> id | [ids] | 'ALL' | null (unknown keys ignored)
  function Cube(dims, measures) {
    this.keys = dims.map((d) => d[0]);
    this.ids = dims.map((d) => d[1]);
    this.pos = dims.map((d) => new Map(d[1].map((id, i) => [id, i])));
    this.M = measures;
    this.nm = measures.length;
    this.stride = [];
    let s = 1;
    for (let i = dims.length - 1; i >= 0; i--) { this.stride[i] = s; s *= dims[i][1].length; }
    this.data = new Float32Array(s * this.nm);
    this.cache = new Map();
  }
  Cube.prototype.offset = function (c) {
    let o = 0;
    for (let i = 0; i < this.keys.length; i++) o += this.pos[i].get(c[this.keys[i]]) * this.stride[i];
    return o * this.nm;
  };
  Cube.prototype.put = function (c, vals) {
    const o = this.offset(c);
    for (let j = 0; j < this.nm; j++) this.data[o + j] += vals[this.M[j]] || 0;
  };
  Cube.prototype.sum = function (f) {
    f = f || {};
    const lists = this.keys.map((k, i) => {
      const v = f[k];
      if (v == null || v === 'ALL') return null;
      return (Array.isArray(v) ? v : [v]).map((id) => this.pos[i].get(id)).filter((x) => x != null);
    });
    const ck = lists.map((l) => (l ? l.join(',') : '*')).join('|');
    const hit = this.cache.get(ck);
    if (hit) return hit;
    const acc = new Float64Array(this.nm);
    const nd = this.keys.length, data = this.data, nm = this.nm, stride = this.stride, ids = this.ids;
    const rec = (d, off) => {
      if (d === nd) { const o = off * nm; for (let j = 0; j < nm; j++) acc[j] += data[o + j]; return; }
      const l = lists[d];
      if (l) for (let i = 0; i < l.length; i++) rec(d + 1, off + l[i] * stride[d]);
      else for (let i = 0; i < ids[d].length; i++) rec(d + 1, off + i * stride[d]);
    };
    rec(0, 0);
    const out = {};
    this.M.forEach((m, j) => (out[m] = acc[j]));
    if (this.cache.size > 60000) this.cache.clear();
    this.cache.set(ck, out);
    return out;
  };

  const MONTHS = [];
  for (let i = 0; i < 24; i++) MONTHS.push(new Date(Date.UTC(2024, 8 + i, 1)).toISOString().slice(0, 7));
  const monthLabel = (m) => {
    const [y, mo] = m.split('-');
    return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+mo - 1] + ' ' + y.slice(2);
  };

  // ---------------- dimensions (illustrative, not official figures) ----------------
  // risk: relative delinquency vs PL; trend: shape of the industry cycle
  const PRODUCTS = [
    { id: 'PL', name: 'Personal Loan', long: 'Unsecured Personal Loan', base: 1500000, growth: 0.13, ticket: 2.4, orig: 0.075, risk: 1, trend: 'pl', bands: 'pl' },
    { id: 'CC', name: 'Credit Card', long: 'Credit Card', base: 290000, growth: 0.15, ticket: 0.45, orig: 0.11, risk: 1.45, trend: 'cc', bands: 'cc' },
    { id: 'HL', name: 'Housing Loan', long: 'Housing Loan', base: 3000000, growth: 0.12, ticket: 28, orig: 0.018, risk: 0.35, trend: 'improve', bands: 'secured' },
    { id: 'LAP', name: 'Loan Against Property', long: 'Loan Against Property (LAP)', base: 950000, growth: 0.16, ticket: 35, orig: 0.025, risk: 0.62, trend: 'flat', bands: 'secured' },
    { id: 'AL', name: 'Auto Loan', long: 'Auto Loan', base: 650000, growth: 0.14, ticket: 6, orig: 0.04, risk: 0.7, trend: 'flat', bands: 'mid' },
    { id: 'TW', name: 'Two-Wheeler Loan', long: 'Two-Wheeler Loan', base: 150000, growth: 0.12, ticket: 0.8, orig: 0.06, risk: 1.55, trend: 'mild', bands: 'mass' },
    { id: 'GL', name: 'Gold Loan', long: 'Gold Loan', base: 550000, growth: 0.24, ticket: 1.2, orig: 0.15, risk: 0.45, trend: 'flat', bands: 'mass' },
    { id: 'MSME', name: 'MSME Loan', long: 'MSME Loan', base: 2600000, growth: 0.12, ticket: 15, orig: 0.04, risk: 1.15, trend: 'mild', bands: 'mid' },
    { id: 'AGRI', name: 'Agri Loan', long: 'Agriculture Loan', base: 1900000, growth: 0.1, ticket: 1.8, orig: 0.05, risk: 1.35, trend: 'flat', bands: 'mass' },
    { id: 'MFL', name: 'Microfinance Loan', long: 'Microfinance Loan', base: 420000, growth: 0.04, ticket: 0.45, orig: 0.08, risk: 1.2, trend: 'mf', bands: 'mf' }
  ];
  // All states individually; the 8 north-eastern states grouped; small UTs grouped.
  const STATES = [
    ['AP', 'Andhra Pradesh', 0.05, 1.08, 1.1, 1.0], ['BR', 'Bihar', 0.025, 1.25, 1.2, 1.6], ['CG', 'Chhattisgarh', 0.012, 1.1, 1.0, 1.0],
    ['DL', 'Delhi (NCT)', 0.06, 0.92, 0.9, 0.7], ['GA', 'Goa', 0.006, 0.9, 0.8, 0.7], ['GJ', 'Gujarat', 0.07, 0.9, 0.5, 0.8],
    ['HR', 'Haryana', 0.03, 1.0, 1.0, 0.9], ['HP', 'Himachal Pradesh', 0.006, 0.95, 0.8, 0.8], ['JK', 'Jammu & Kashmir', 0.008, 1.1, 1.0, 0.8],
    ['JH', 'Jharkhand', 0.012, 1.15, 1.1, 1.2], ['KA', 'Karnataka', 0.09, 0.93, 0.8, 1.3], ['KL', 'Kerala', 0.04, 1.0, 0.9, 1.0],
    ['MP', 'Madhya Pradesh', 0.04, 1.12, 1.1, 1.2], ['MH', 'Maharashtra', 0.16, 0.97, 0.8, 1.0], ['OD', 'Odisha', 0.02, 1.1, 1.1, 1.4],
    ['PB', 'Punjab', 0.025, 1.05, 1.0, 0.9], ['RJ', 'Rajasthan', 0.04, 1.1, 1.1, 1.1], ['TN', 'Tamil Nadu', 0.1, 1.02, 0.9, 1.2],
    ['TG', 'Telangana', 0.06, 1.08, 1.3, 1.0], ['UP', 'Uttar Pradesh', 0.08, 1.2, 1.9, 1.3], ['UK', 'Uttarakhand', 0.01, 1.0, 0.9, 0.9],
    ['WB', 'West Bengal', 0.05, 1.08, 1.0, 1.3], ['NE', 'North-East states', 0.02, 1.3, 1.2, 1.3], ['UT', 'Other UTs', 0.012, 1.0, 1.0, 0.9]
  ].map(([id, name, w, risk, trend, mf]) => ({ id, name, w, risk, trend, mf }));
  // Product-specific geographic tilt (e.g. agri in the grain belt, microfinance in the east)
  const tilt = {
    AGRI: { UP: 1.8, MP: 1.8, RJ: 1.6, PB: 1.8, AP: 1.5, HR: 1.5, MH: 0.7, DL: 0.1, GA: 0.2, UT: 0.3, KL: 0.6 },
    MFL: { BR: 3, TN: 2, KA: 1.8, WB: 2, UP: 1.6, OD: 2.4, MP: 1.4, JH: 1.5, MH: 0.8, DL: 0.2, GA: 0.2, HP: 0.4, UT: 0.3, PB: 0.5 },
    HL: { MH: 1.3, KA: 1.2, DL: 1.2, GJ: 1.1, BR: 0.5, NE: 0.5, JH: 0.6 },
    GL: { TN: 2, KL: 2.5, KA: 1.3, AP: 1.5, TG: 1.3, DL: 0.6, PB: 0.6 },
    CC: { MH: 1.3, KA: 1.4, DL: 1.4, TG: 1.2, BR: 0.4, NE: 0.4, JH: 0.5 },
    PL: { UP: 1.2, GJ: 1.1 }
  };
  const BANDS = [
    { id: 'SP', name: 'Super-prime', range: '791+', lo: 791, sens: 0.2, cure: 0.62 },
    { id: 'PP', name: 'Prime-plus', range: '761–790', lo: 761, sens: 0.4, cure: 0.55 },
    { id: 'PR', name: 'Prime', range: '721–760', lo: 721, sens: 0.7, cure: 0.48 },
    { id: 'NP', name: 'Near-prime', range: '681–720', lo: 681, sens: 1.0, cure: 0.4 },
    { id: 'SB', name: 'Subprime', range: '≤680', lo: 300, sens: 1.35, cure: 0.31 }
  ];
  const LENDERS = [
    // Labels are abbreviations only (UI requirement); long form kept for reference.
    { id: 'PSU', name: 'PSU', long: 'Public sector banks', risk: 1.05, trend: 0.7 },
    { id: 'PVT', name: 'PVT', long: 'Private sector banks', risk: 0.86, trend: 0.9 },
    { id: 'NBFC', name: 'NBFC', long: 'Non-banking financial companies', risk: 1.14, trend: 1.1 },
    { id: 'FIN', name: 'Fintech', long: 'Fintech lenders', risk: 1.38, trend: 1.6 },
    { id: 'SFB', name: 'SFB', long: 'Small finance banks', risk: 1.22, trend: 1.2 },
    { id: 'MFI', name: 'MFI', long: 'Microfinance institutions', risk: 1.5, trend: 1.4 },
    { id: 'RRB', name: 'RRB/DCCB', long: 'Regional rural & district co-operative banks', risk: 1.3, trend: 0.9 },
    { id: 'HFC', name: 'HFC', long: 'Housing finance companies', risk: 0.95, trend: 0.8 }
  ];
  const BAND_TEMPLATES = {
    secured: [0.36, 0.24, 0.2, 0.12, 0.08], pl: [0.3, 0.22, 0.22, 0.15, 0.11], cc: [0.34, 0.22, 0.2, 0.14, 0.1],
    mid: [0.28, 0.22, 0.24, 0.15, 0.11], mass: [0.18, 0.18, 0.26, 0.2, 0.18], mf: [0.1, 0.14, 0.26, 0.26, 0.24]
  };
  const LT = ['PSU', 'PVT', 'NBFC', 'FIN', 'SFB', 'MFI', 'RRB', 'HFC'];
  const LENDER_MIX = {
    PL: [0.2, 0.36, 0.22, 0.1, 0.05, 0.02, 0.03, 0.02], CC: [0.12, 0.69, 0.07, 0.06, 0.03, 0.01, 0.01, 0.01],
    HL: [0.35, 0.3, 0.04, 0, 0.02, 0, 0.03, 0.25], LAP: [0.15, 0.3, 0.3, 0.02, 0.06, 0, 0.02, 0.15],
    AL: [0.2, 0.5, 0.25, 0.01, 0.02, 0, 0.02, 0], TW: [0.05, 0.25, 0.55, 0.1, 0.04, 0.01, 0, 0],
    GL: [0.35, 0.15, 0.4, 0.02, 0.03, 0.01, 0.04, 0], MSME: [0.38, 0.35, 0.15, 0.04, 0.04, 0.01, 0.03, 0],
    AGRI: [0.55, 0.18, 0.03, 0, 0.03, 0.01, 0.2, 0], MFL: [0.02, 0.35, 0.12, 0.01, 0.18, 0.32, 0, 0]
  };
  const BASE_DPD = [0.006, 0.013, 0.026, 0.052, 0.095]; // by band, for risk = 1

  const norm = (o) => { const t = Object.values(o).reduce((a, b) => a + b, 0); const r = {}; for (const k in o) r[k] = o[k] / t; return r; };
  const byId = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));
  const P = byId(PRODUCTS), S = byId(STATES), B = byId(BANDS), L = byId(LENDERS);
  const PIDS = PRODUCTS.map((x) => x.id), SIDS = STATES.map((x) => x.id), BIDS = BANDS.map((x) => x.id), LIDS = LENDERS.map((x) => x.id);
  // state weights per product, normalised
  const stW = {};
  PRODUCTS.forEach((p) => { const o = {}; STATES.forEach((s) => (o[s.id] = s.w * ((tilt[p.id] || {})[s.id] || 1))); stW[p.id] = norm(o); });
  const lenderW = {};
  PRODUCTS.forEach((p) => { const o = {}; LT.forEach((l, i) => (o[l] = Math.max(0.005, LENDER_MIX[p.id][i]))); lenderW[p.id] = norm(o); });
  const bandW = {};
  PRODUCTS.forEach((p) => { const o = {}; BIDS.forEach((b, i) => (o[b] = BAND_TEMPLATES[p.bands][i])); bandW[p.id] = o; });

  // Industry cycle by product (x > 0 = deterioration)
  function cycle(p, t, st) {
    switch (P[p].trend) {
      case 'pl': return (t < 14 ? 0.0008 * (t - 14) : 0.014 * (t - 14)) * st.trend;
      case 'cc': return 0.0065 * t * st.trend;
      case 'mf': return (t < 5 ? 0 : t < 17 ? 0.05 * (t - 5) : 0.6 - 0.02 * (t - 17)) * st.mf;
      case 'mild': return 0.004 * t * st.trend;
      case 'improve': return -0.004 * t;
      default: return 0.001 * t * st.trend;
    }
  }

  // ---------------- Industry ----------------
  const MEAS = ['bal', 'acc', 'orig', 'd30', 'd90', 'd180', 'cureN', 'cureD'];
  const industry = new Cube([['m', MONTHS], ['p', PIDS], ['s', SIDS], ['b', BIDS], ['l', LIDS]], MEAS);
  const NP_ = PIDS.length, NS_ = SIDS.length, NB_ = BIDS.length, NL_ = LIDS.length;
  const ltAcc = new Float64Array(MONTHS.length * NP_ * NS_ * NL_ * 6); // m,p,s,l totals for peer baselines
  const pvtRate = new Float64Array(MONTHS.length * NP_ * NS_ * NB_ * 2); // PVT d30, cure by m,p,s,b
  MONTHS.forEach((m, t) => {
    PRODUCTS.forEach((prod, pi) => {
      const total = prod.base * Math.pow(1 + prod.growth * (1 - t / 60), t / 12);
      STATES.forEach((st, si) => {
        const cyc = cycle(prod.id, t, st);
        BANDS.forEach((bd, bi) => {
          LENDERS.forEach((ld, li) => {
            const tl = ld.id === 'FIN' && (bd.id === 'NP' || bd.id === 'SB') ? 1 + 0.01 * t : 1;
            const bal = total * stW[prod.id][st.id] * bandW[prod.id][bd.id] * lenderW[prod.id][ld.id] * tl * noise(0.02);
            const tf = Math.max(0.5, 1 + cyc * bd.sens * ld.trend);
            const d30 = Math.min(0.45, BASE_DPD[bi] * prod.risk * st.risk * ld.risk * tf * noise(0.035));
            const acc = (bal * 1e7) / (prod.ticket * 1e5);
            const cureDen = acc * d30 * 0.62;
            const cure = Math.min(0.9, Math.max(0.1, bd.cure / Math.pow(tf, 1.1)) * noise(0.03));
            const d90 = d30 * 0.46 * noise(0.04);
            industry.put({ m, p: prod.id, s: st.id, b: bd.id, l: ld.id }, {
              bal, acc, orig: bal * prod.orig * noise(0.05), d30: bal * d30, d90: bal * d90, d180: bal * d90 * 0.55 * noise(0.04),
              cureN: cureDen * cure, cureD: cureDen
            });
            if (ld.id === 'PVT') { const o = (((t * NP_ + pi) * NS_ + si) * NB_ + bi) * 2; pvtRate[o] = d30; pvtRate[o + 1] = cure; }
            const lo = (((t * NP_ + pi) * NS_ + si) * NL_ + li) * 6;
            ltAcc[lo] += bal; ltAcc[lo + 1] += bal * d30; ltAcc[lo + 2] += bal * d90; ltAcc[lo + 3] += bal * d90 * 0.55; ltAcc[lo + 4] += cureDen * cure; ltAcc[lo + 5] += cureDen;
          });
        });
      });
    });
  });

  // ---------------- Member (Sahyadri Bank) ----------------
  const memberBase = { HL: 22000, LAP: 9000, AL: 6000, TW: 1500, PL: 12000, CC: 2400, GL: 3500, MSME: 11000, AGRI: 4000, MFL: 1800 };
  const memberGrowth = { PL: 0.2, MSME: 0.17, CC: 0.16, GL: 0.15, LAP: 0.13, HL: 0.11, AL: 0.11, TW: 0.1, AGRI: 0.08, MFL: 0.01 };
  const memberMult = { HL: 0.9, LAP: 1.0, AL: 0.95, TW: 1.05, PL: 1.04, CC: 0.93, GL: 0.9, MSME: 1.05, AGRI: 1.0, MFL: 1.08 };
  const footprint = norm({ MH: 0.3, GJ: 0.12, KA: 0.08, TN: 0.06, UP: 0.09, TG: 0.05, DL: 0.05, RJ: 0.04, MP: 0.04, KL: 0.02, AP: 0.03, WB: 0.02, HR: 0.02, PB: 0.01, BR: 0.01, OD: 0.01, CG: 0.01, JH: 0.005, UK: 0.005, HP: 0.002, GA: 0.01, JK: 0.003, NE: 0.005, UT: 0.005 });
  const memW = {};
  PRODUCTS.forEach((p) => { const o = {}; SIDS.forEach((s) => (o[s] = footprint[s] * ((tilt[p.id] || {})[s] || 1))); memW[p.id] = norm(o); });
  const POLICY_T = MONTHS.indexOf('2026-02');

        const m1 = value('member', 'dpd30', { p, s: st.id, m: t }), m0 = value('member', 'dpd30', { p, s: st.id, m: t3 });
        const i1 = value('industry', 'dpd30', { p, s: st.id, m: t }), i0 = value('industry', 'dpd30', { p, s: st.id, m: t3 });

            title: id > 0.001

            detail: `Up ${(md * 100).toFixed(2)} pp over 3 months to ${(m1 * 100).toFixed(2)}% vs industry ${id >= 0 ? '+' : ''}${(id * 100).toFixed(2)} pp.`,

/*
 * Minimal, dependency-free SVG charts. Colors come from CSS custom properties so light/dark

(function (root) {
  const PIQ = (root.PIQ = root.PIQ || {});

  function h(tag, cls, parent, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;

  }

  function niceTicks(min, max, count) {
    if (min === max) { max = min + 1; }

  let tip;

      const row = h('div', 'viz-tip-row', t);
      const key = h('span', 'viz-tip-key', row);

  function line(container, opts) {

        (s.marks || []).forEach((mk) => {
          const p = s.points.find((q) => q.x === mk);
          if (p && p.y != null) svgEl('circle', { cx: X(p.x), cy: Y(p.y), r: 5, class: 'viz-dot', style: { fill: s.color } }, g);
        });
      });
      // end dots + labels
      const ends = series.map((s) => {
        const pts = s.points.filter((p) => p.y != null);
        const last = pts[pts.length - 1];
        svgEl('circle', { cx: X(last.x), cy: Y(last.y), r: 4, class: 'viz-dot', style: { fill: s.color } }, g);
        return { s, y: Y(last.y), v: last.y, x: X(last.x) };
      });
      if (opts.endLabels) {
        const sorted = ends.slice().sort((a, b) => a.y - b.y);
        const collide = sorted.some((e, i) => i && e.y - sorted[i - 1].y < 26);
        if (!collide) {
          ends.forEach((e) => {
            svgEl('text', { x: e.x + 9, y: e.y - 2, class: 'viz-end-val', text: (opts.yFmt || tf)(e.v) }, g);
            svgEl('text', { x: e.x + 9, y: e.y + 11, class: 'viz-end-name', text: e.s.name }, g);
          });
        } else {
          ends.forEach((e) => svgEl('text', { x: e.x + 9, y: e.y + 4, class: 'viz-end-val', text: (opts.yFmt || tf)(e.v) }, g));
          // values only; names live in the legend — never nudge detached labels
          const ys = ends.map((e) => e.y).sort((a, b) => a - b);
          if (ys.some((y, i) => i && y - ys[i - 1] < 13)) g.querySelectorAll('.viz-end-val').forEach((n) => n.remove());
        }
      }
      // crosshair
      const cross = svgEl('line', { x1: 0, x2: 0, y1: M.t, y2: M.t + ih, class: 'viz-cross', style: { display: 'none' } }, svg);
      const hits = series.map((s) => svgEl('circle', { r: 5, class: 'viz-dot', style: { fill: s.color, display: 'none' } }, svg));
      const hit = svgEl('rect', { x: M.l, y: M.t, width: iw, height: ih, fill: 'transparent', tabindex: 0 }, svg);
      const nearest = (px) => {
        let bi = 0, bd = Infinity;
        xs.forEach((x, i) => { const dd = Math.abs(X(x) - px); if (dd < bd) { bd = dd; bi = i; } });
        return bi;
      };
      const move = (evt, idx) => {
        const i = idx != null ? idx : nearest(evt.clientX - svg.getBoundingClientRect().left);
        const x = xs[i];
        cross.setAttribute('x1', X(x)); cross.setAttribute('x2', X(x)); cross.style.display = '';
        const rows = [];
        series.forEach((s, si) => {
          const p = s.points[i];
          if (p && p.y != null) {
            hits[si].setAttribute('cx', X(x)); hits[si].setAttribute('cy', Y(p.y)); hits[si].style.display = '';
            rows.push({ color: s.color, value: (opts.yFmt || tf)(p.y), name: s.name });
          } else hits[si].style.display = 'none';
        });
        const r = svg.getBoundingClientRect();
        showTip(evt && evt.clientX ? evt : { clientX: r.left + X(x), clientY: r.top + M.t }, xl(x, true), rows);
      };
      hit.addEventListener('pointermove', (e) => move(e));
      hit.addEventListener('pointerleave', () => { cross.style.display = 'none'; hits.forEach((c) => (c.style.display = 'none')); hideTip(); });
      let ki = xs.length - 1;
      hit.addEventListener('focus', () => move(null, ki));
      hit.addEventListener('blur', hideTip);
      hit.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { ki = Math.max(0, ki - 1); move(null, ki); }
        if (e.key === 'ArrowRight') { ki = Math.min(xs.length - 1, ki + 1); move(null, ki); }
      });
    });
  }

  // ---------- Horizontal bars ----------
  // opts: { items:[{label,value,color,ref,refLabel,tag}], fmt, color, refName }
  function bars(container, opts) {
    responsive(container, () => {
      container.innerHTML = '';
      const items = opts.items;
      if (opts.refName) legend(container, [{ name: opts.valueName || 'Value', color: opts.color }, { name: opts.refName, color: 'var(--ink-2)' }], 'rect');
      const W = Math.max(280, container.clientWidth);
      const rowH = 34, M = { t: 6, r: 70, b: 6, l: Math.min(170, Math.max(...items.map((i) => textW(i.label, 12))) + 16) };
      const H = M.t + M.b + rowH * items.length;
      const iw = W - M.l - M.r;
      const vals = items.map((i) => i.value).concat(items.map((i) => i.ref || 0));
      const vmin = Math.min(0, ...vals), vmax = Math.max(0, ...vals);
      const Xs = (v) => M.l + ((v - vmin) / (vmax - vmin || 1)) * iw;
      const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'viz-svg', role: 'img', 'aria-label': opts.aria || 'Bar chart' }, container);
      svgEl('line', { x1: Xs(0), x2: Xs(0), y1: M.t, y2: H - M.b, class: 'viz-base' }, svg);
      items.forEach((it, i) => {
        const cy = M.t + i * rowH + rowH / 2;
        const bh = Math.min(20, rowH - 12);
        svgEl('text', { x: M.l - 10, y: cy + 4, 'text-anchor': 'end', class: 'viz-label', text: it.label }, svg);
        const x0 = Xs(0), x1 = Xs(it.value);
        const neg = x1 < x0, w = Math.abs(x1 - x0);
        const r = Math.min(4, w);
        const top = cy - bh / 2;
        const d = neg
          ? `M${x0},${top}H${x1 + r}Q${x1},${top} ${x1},${top + r}V${top + bh - r}Q${x1},${top + bh} ${x1 + r},${top + bh}H${x0}Z`
          : `M${x0},${top}H${x1 - r}Q${x1},${top} ${x1},${top + r}V${top + bh - r}Q${x1},${top + bh} ${x1 - r},${top + bh}H${x0}Z`;
        const bar = svgEl('path', { d, class: 'viz-bar', style: { fill: it.color || opts.color || 'var(--s1)' }, tabindex: 0 }, svg);
        const lab = svgEl('text', { x: neg ? x1 - 6 : x1 + 6, y: cy + 4, 'text-anchor': neg ? 'end' : 'start', class: 'viz-val', text: opts.fmt(it.value) }, svg);
        if (it.ref != null) {
          const rx = Xs(it.ref);
          svgEl('line', { x1: rx, x2: rx, y1: cy - bh / 2 - 4, y2: cy + bh / 2 + 4, class: 'viz-ref' }, svg);
          if (!neg && Math.abs(rx - (x1 + 6)) < textW(opts.fmt(it.value)) + 6 && rx > x1) lab.setAttribute('x', rx + 6);
        }
        const tipRows = [{ color: it.color || opts.color || 'var(--s1)', value: opts.fmt(it.value), name: opts.valueName || it.label, shape: 'rect' }];
        if (it.ref != null) tipRows.push({ color: 'var(--ink-2)', value: opts.fmt(it.ref), name: opts.refName || 'Benchmark' });
        const on = (e) => { bar.classList.add('hover'); showTip(e, it.label, tipRows); };
        bar.addEventListener('pointermove', on);
        bar.addEventListener('focus', () => { const r = bar.getBoundingClientRect(); on({ clientX: r.right, clientY: r.top }); });
        bar.addEventListener('pointerleave', () => { bar.classList.remove('hover'); hideTip(); });
        bar.addEventListener('blur', () => { bar.classList.remove('hover'); hideTip(); });
      });
    });
  }

  // ---------- Dot plot (member vs peer vs industry per row) ----------
  // opts: { rows:[{label, values:{key:v}}], series:[{key,name,color}], fmt }
  function dots(container, opts) {
    responsive(container, () => {
      container.innerHTML = '';
      const series = opts.series.filter((s) => opts.rows.some((r) => r.values[s.key] != null));
      legend(container, series, 'dot');
      const W = Math.max(280, container.clientWidth), rowH = 36;
      const M = { t: 8, r: 24, b: 26, l: Math.min(160, Math.max(...opts.rows.map((r) => textW(r.label, 12))) + 16) };
      const H = M.t + M.b + rowH * opts.rows.length;
      const iw = W - M.l - M.r;
      const all = [];
      opts.rows.forEach((r) => series.forEach((s) => r.values[s.key] != null && all.push(r.values[s.key])));
      const ticks = niceTicks(Math.min(...all) * 0.9, Math.max(...all) * 1.05, 4);
      const X = (v) => M.l + ((v - ticks[0]) / (ticks[ticks.length - 1] - ticks[0])) * iw;
      const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'viz-svg', role: 'img', 'aria-label': opts.aria || 'Dot plot' }, container);
      ticks.forEach((t) => {
        svgEl('line', { x1: X(t), x2: X(t), y1: M.t, y2: H - M.b, class: 'viz-grid' }, svg);
        svgEl('text', { x: X(t), y: H - 8, 'text-anchor': 'middle', class: 'viz-tick', text: opts.fmt(t) }, svg);
      });
      opts.rows.forEach((r, i) => {
        const cy = M.t + i * rowH + rowH / 2;
        svgEl('text', { x: M.l - 10, y: cy + 4, 'text-anchor': 'end', class: 'viz-label', text: r.label }, svg);
        const vs = series.map((s) => r.values[s.key]).filter((v) => v != null);
        svgEl('line', { x1: X(Math.min(...vs)), x2: X(Math.max(...vs)), y1: cy, y2: cy, class: 'viz-range' }, svg);
        series.forEach((s) => {
          const v = r.values[s.key];
          if (v == null) return;
          svgEl('circle', { cx: X(v), cy, r: s.key === series[0].key ? 6 : 5, class: 'viz-dot', style: { fill: s.color } }, svg);
        });
        const hitR = svgEl('rect', { x: M.l, y: cy - rowH / 2, width: iw, height: rowH, fill: 'transparent', tabindex: 0 }, svg);
        const rows = series.filter((s) => r.values[s.key] != null).map((s) => ({ color: s.color, value: opts.fmt(r.values[s.key]), name: s.name }));
        hitR.addEventListener('pointermove', (e) => showTip(e, r.label, rows));
        hitR.addEventListener('pointerleave', hideTip);
        hitR.addEventListener('focus', () => { const b = hitR.getBoundingClientRect(); showTip({ clientX: b.left + b.width / 2, clientY: b.top }, r.label, rows); });
        hitR.addEventListener('blur', hideTip);
      });
    });
  }

  // ---------- 100% stacked columns ----------
  // opts: { x:[...], xLabel, stacks:[{name,color,values:[]}], fmt }
  function stacked(container, opts) {
    responsive(container, () => {
      container.innerHTML = '';
      legend(container, opts.stacks, 'rect');
      const W = Math.max(280, container.clientWidth), H = opts.height || 220;
      const M = { t: 8, r: 8, b: 26, l: 40 };
      const iw = W - M.l - M.r, ih = H - M.t - M.b;
      const n = opts.x.length, band = iw / n, bw = Math.min(24, band - 2);
      const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'viz-svg', role: 'img', 'aria-label': opts.aria || 'Stacked columns' }, container);
      [0, 0.25, 0.5, 0.75, 1].forEach((t) => {
        const y = M.t + ih - t * ih;
        svgEl('line', { x1: M.l, x2: M.l + iw, y1: y, y2: y, class: t === 0 ? 'viz-base' : 'viz-grid' }, svg);
        svgEl('text', { x: M.l - 6, y: y + 4, 'text-anchor': 'end', class: 'viz-tick', text: Math.round(t * 100) + '%' }, svg);
      });
      const step = Math.max(1, Math.ceil(n / Math.floor(iw / 60)));
      opts.x.forEach((x, i) => {
        const cx = M.l + band * i + band / 2;
        const tot = opts.stacks.reduce((a, s) => a + s.values[i], 0);
        let acc = 0;
        opts.stacks.forEach((s, si) => {
          const v = s.values[i] / tot;
          const y1 = M.t + ih - acc * ih, hgt = v * ih;
          const isTop = si === opts.stacks.length - 1;
          const gap = si > 0 ? 2 : 0;
          const r = isTop ? Math.min(4, hgt) : 0;
          const top = y1 - hgt, x0 = cx - bw / 2;
          const d = `M${x0},${y1 - gap}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + bw - r}Q${x0 + bw},${top} ${x0 + bw},${top + r}V${y1 - gap}Z`;
          const seg = svgEl('path', { d, class: 'viz-bar', style: { fill: s.color } }, svg);
          seg.addEventListener('pointermove', (e) => {
            seg.classList.add('hover');
            showTip(e, (opts.xLabel || String)(x), opts.stacks.slice().reverse().map((q) => ({ color: q.color, value: (opts.fmt || ((z) => (z * 100).toFixed(1) + '%'))(q.values[i] / tot), name: q.name, shape: 'rect' })));
          });
          seg.addEventListener('pointerleave', () => { seg.classList.remove('hover'); hideTip(); });
          acc += v;
        });
        if (i % step === 0) svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: 'viz-tick', text: (opts.xLabel || String)(x) }, svg);
      });
    });
  }

  // ---------- Waterfall ----------
  // opts: { start:{label,value}, steps:[{label,value,note}], end:{label,value}, fmt, deltaFmt, upIsBad }
  function waterfall(container, opts) {
    responsive(container, () => {
      container.innerHTML = '';
      const W = Math.max(280, container.clientWidth), H = opts.height || 260;
      const cols = [{ type: 'total', label: opts.start.label, value: opts.start.value }]
        .concat(opts.steps.map((s) => ({ type: 'step', ...s })))
        .concat([{ type: 'total', label: opts.end.label, value: opts.end.value }]);
      let run = opts.start.value;
      cols.forEach((c) => {
        if (c.type === 'step') { c.from = run; c.to = run + c.value; run = c.to; }
        else { c.from = 0; c.to = c.value; }
      });
      const lo = Math.min(...cols.map((c) => Math.min(c.from, c.to)).filter((v) => v > 0)) * 0.85;
      const hi = Math.max(...cols.map((c) => Math.max(c.from, c.to))) * 1.08;
      const ticks = niceTicks(opts.zero ? 0 : lo, hi, 4);
      const M = { t: 22, r: 8, b: 42, l: Math.max(...ticks.map((t) => textW(opts.fmt(t)))) + 14 };
      const iw = W - M.l - M.r, ih = H - M.t - M.b;
      const Y = (v) => M.t + ih - ((v - ticks[0]) / (ticks[ticks.length - 1] - ticks[0])) * ih;
      const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'viz-svg', role: 'img', 'aria-label': opts.aria || 'Waterfall' }, container);
      ticks.forEach((t) => {
        svgEl('line', { x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t), class: 'viz-grid' }, svg);
        svgEl('text', { x: M.l - 8, y: Y(t) + 4, 'text-anchor': 'end', class: 'viz-tick', text: opts.fmt(t) }, svg);
      });
      const band = iw / cols.length, bw = Math.min(44, band * 0.6);
      cols.forEach((c, i) => {
        const cx = M.l + band * i + band / 2, x0 = cx - bw / 2;
        const top = Y(Math.max(c.from, c.to)), bot = c.type === 'total' ? M.t + ih : Y(Math.min(c.from, c.to));
        const hgt = Math.max(2, bot - top), r = Math.min(4, hgt / 2);
        const up = c.type === 'step' && c.value > 0;
        const color = c.type === 'total' ? 'var(--s1)' : (up === !!opts.upIsBad ? 'var(--st-critical)' : 'var(--st-good)');
        const d = `M${x0},${top + hgt}V${top + r}Q${x0},${top} ${x0 + r},${top}H${x0 + bw - r}Q${x0 + bw},${top} ${x0 + bw},${top + r}V${top + hgt}Z`;
        const bar = svgEl('path', { d, class: 'viz-bar', style: { fill: color }, tabindex: 0 }, svg);
        if (i < cols.length - 1) {
          const nextFrom = c.type === 'total' ? c.to : c.to;
          svgEl('line', { x1: x0 + bw, x2: x0 + band, y1: Y(nextFrom), y2: Y(nextFrom), class: 'viz-connector' }, svg);
        }
        const valText = c.type === 'total' ? opts.fmt(c.value) : (c.value > 0 ? '+' : '−') + (opts.deltaFmt || opts.fmt)(Math.abs(c.value));
        svgEl('text', { x: cx, y: top - 6, 'text-anchor': 'middle', class: 'viz-val', text: valText }, svg);
        // wrap the category label into at most two lines that fit the column band
        const maxCh = Math.max(5, Math.floor(band / 7));
        const words = c.label.replace(/-/g, '- ').split(' ').filter(Boolean);
        const l1 = [], l2 = [];
        words.forEach((w) => ((l1.join(' ') + ' ' + w).trim().length <= maxCh && !l2.length ? l1 : l2).push(w));
        const join = (arr) => arr.join(' ').replace(/- /g, '-');
        const lab1 = svgEl('text', { x: cx, y: H - 24, 'text-anchor': 'middle', class: 'viz-label', text: join(l1) || join(l2) }, svg);
        if (l1.length && l2.length) svgEl('text', { x: cx, y: H - 10, 'text-anchor': 'middle', class: 'viz-label', text: join(l2) }, svg);
        if (band < 80) lab1.parentNode.querySelectorAll('.viz-label').forEach((n) => { n.style.fontSize = '11px'; });
        const rows = [{ color, value: valText, name: c.note || c.label, shape: 'rect' }];
        bar.addEventListener('pointermove', (e) => { bar.classList.add('hover'); showTip(e, c.label, rows); });
        bar.addEventListener('pointerleave', () => { bar.classList.remove('hover'); hideTip(); });
      });
    });
  }

  // ---------- Sparkline ----------
  function spark(container, values, color) {
    container.innerHTML = '';
    const W = 120, H = 32;
    const v = values.filter((x) => x != null);
    const lo = Math.min(...v), hi = Math.max(...v);
    const X = (i) => 2 + (i / (values.length - 1)) * (W - 8);
    const Y = (y) => 4 + (1 - (y - lo) / (hi - lo || 1)) * (H - 8);
    const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'viz-spark', 'aria-hidden': 'true' }, container);
    svgEl('path', { d: values.map((y, i) => (i ? 'L' : 'M') + X(i) + ',' + Y(y)).join(''), class: 'viz-spark-line' }, svg);
    svgEl('circle', { cx: X(values.length - 1), cy: Y(values[values.length - 1]), r: 3, style: { fill: color || 'var(--s1)' } }, svg);
  }

  PIQ.charts = { line, bars, dots, stacked, waterfall, spark, legend, showTip, hideTip, h, niceTicks };
})(window);

</script>
  <script>/* js/insights.js */
/*
 * Insight & recommendation engine: turns governed metrics into "what changed, why, and what to do".
 * All outputs carry the numbers they were derived from, so the UI and AI can cite them.
 * Works for a single product or the whole portfolio (p = 'ALL').
 */
(function (root) {
  const PIQ = (root.PIQ = root.PIQ || {});
  const S = PIQ.sem, D = PIQ.data, C = PIQ.config;
  const F = () => PIQ.ui.fmt;
  const pName = (p) => (!p || p === 'ALL' ? 'Total portfolio' : D.P[p].name);

  // Summary of member vs market for a product/state and a delinquency metric
  function snapshot(p, s, metric) {
    metric = metric || 'dpd30';
    const t = S.latest(), t6 = S.monthsAgo(6), t12 = S.monthsAgo(12);
    const f = { p, s };
    const m = (src, met, month) => S.value(src, met, Object.assign({}, f, { m: month }));
    const peer = (PIQ.ui && PIQ.ui.state.peer) || 'mid-pvt';
    const out = {
      p, s, t, t6, metric,
      bal: m('member', 'bal', t), bal12: m('member', 'bal', t12),
      indBal: m('industry', 'bal', t), indBal12: m('industry', 'bal', t12),
      dpd: m('member', metric, t), dpd6: m('member', metric, t6),
      ind: m('industry', metric, t), ind6: m('industry', metric, t6),
      dpd30: m('member', 'dpd30', t), dpd90: m('member', 'dpd90', t), dpd180: m('member', 'dpd180', t),
      ind90: m('industry', 'dpd90', t),
      cure: m('member', 'cure', t), cure6: m('member', 'cure', t6), indCure: m('industry', 'cure', t),
      peer: S.peerValue(peer, metric, { p, s, m: t }), peer6: S.peerValue(peer, metric, { p, s, m: t6 }),
      peer30: S.peerValue(peer, 'dpd30', { p, s, m: t })
    };
    out.share = out.bal / out.indBal;
    out.share12 = out.bal12 / out.indBal12;
    out.growth = out.bal / out.bal12 - 1;
    out.indGrowth = out.indBal / out.indBal12 - 1;
    return out;
  }

  function driverLabel(seg) {
    const parts = [['mix', Math.abs(seg.mix)], ['market', Math.abs(seg.market)], ['own', Math.abs(seg.own)]].sort((a, b) => b[1] - a[1]);
    return parts[0][0];
  }

  // Recommendations for one product
  function productRecs(p) {
    const recs = [];
    const P = D.P[p];
    const cur = C.currentCutoff[p];
    const t = S.latest();
    const prodBal = S.value('member', 'bal', { p, m: t });
    const material = (s) => S.value('member', 'bal', { p, s, m: t }) >= prodBal * 0.03;
    const states = D.STATES.filter((st) => material(st.id));
    // 1) state-level cut-off optimisation where the book has deteriorated
    const perState = states.map((st) => {
      const dec = S.decompose({ p, s: st.id, t0: C.policyChangeMonth, t1: t, dim: 'b' });
      const a = S.simulate(p, st.id, cur);
      let best = a;
      if (dec.mix + dec.own > 0.002)
        for (let c = cur - 20; c <= cur + 40; c += 10) { const r = S.simulate(p, st.id, c); if (r.netCr > best.netCr + Math.max(0.05, Math.abs(a.netCr) * 0.02)) best = r; }
      return { st, cur: a, best, dec };
    });
    const tighten = perState.filter((x) => x.best.cutoff > cur);
    if (tighten.length) {
      const gain = tighten.reduce((acc, x) => acc + (x.best.netCr - x.cur.netCr), 0);
      const lossCut = tighten.reduce((acc, x) => acc + (x.cur.expLossCr - x.best.expLossCr), 0);
      const volCut = tighten.reduce((acc, x) => acc + (x.cur.approvedPerMonth - x.best.approvedPerMonth), 0);
      const totalAppr = S.simulate(p, 'ALL', cur).approvedPerMonth;
      const loosened = C.previousCutoff[p] !== cur;
      recs.push({
        id: 'cutoff-' + p, priority: 1, kind: 'policy', p,
        title: `${loosened ? 'Restore' : 'Raise to'} a ${tighten[0].best.cutoff} cut-off for ${P.name}s in ${tighten.map((x) => x.st.name).join(' & ')} only`,
        why: loosened
          ? `Since the ${C.previousCutoff[p]}→${cur} loosening, these states added near-prime/subprime mix and are deteriorating faster than the market. Everywhere else, ${cur} remains the profit-maximising cut-off.`
          : `These states have deteriorated more than the market; a tighter cut-off there improves risk-adjusted profit. Elsewhere ${cur} stays optimal.`,
        impact: [
          ['Net contribution', '+' + F().cr(gain) + ' / month', 'good'],
          ['Expected credit loss', '−' + F().cr(lossCut) + ' / month', 'good'],
          ['Approvals', '−' + ((volCut / totalAppr) * 100).toFixed(1) + '% of ' + P.name + ' volume', 'bad']
        ],
        action: { view: 'simulator', params: { p, s: tighten[0].st.id, cutoff: tighten[0].best.cutoff } },
        states: tighten.map((x) => x.st.id), score: gain
      });
    }
    // 2) idiosyncratic deterioration with a flat market -> sourcing audit
    perState.filter((x) => x.dec.own > 0.003 && Math.abs(x.dec.indDelta) < 0.002 && Math.abs(x.dec.market) < x.dec.own).forEach((x) => {
      recs.push({
        id: 'sourcing-' + p + '-' + x.st.id, priority: 2, kind: 'operations', p,
        title: `Audit ${P.name} sourcing in ${x.st.name}: the market is flat, your book isn't`,
        why: `Industry ${P.name} 30+ DPD in ${x.st.name} moved only ${F().bps(x.dec.indDelta)} since ${D.monthLabel(C.policyChangeMonth)}; yours rose ${F().bps(x.dec.delta)}, of which ${F().bps(x.dec.own)} is member-specific (same segments, worse performance). This points to channel / DSA or underwriting execution, not the economy.`,
        impact: [['Member-specific effect', F().bps(x.dec.own), 'bad'], ['Market effect', F().bps(x.dec.market), '']],
        action: { view: 'upload', params: {} },
        states: [x.st.id], score: x.dec.own * 100
      });
    });
    // 3) application surge -> verification
    const surge = states.map((st) => ({ st, c: S.loginCompare({ p, s: st.id, b: ['NP', 'SB'] }, 5) }))
      .filter((x) => x.c.mem.change > 0.4 && x.c.mem.change - x.c.ind.change > 0.3);
    if (surge.length) {
      const perDay = surge.reduce((a, x) => a + (x.c.mem.recent.perDay - x.c.mem.prior.perDay), 0);
      recs.push({
        id: 'logins-' + p, priority: 1, kind: 'early-warning', p,
        title: `Add enhanced checks on near-prime & subprime ${P.name} applications in ${surge.map((x) => x.st.name).join(' & ')} this week`,
        why: `Applications in these segments are up ${surge.map((x) => F().chg(x.c.mem.change, 0)).join(' / ')} in 5 days while industry moved ${surge.map((x) => F().chg(x.c.ind.change, 0)).join(' / ')}. ${F().pct(surge[0].c.mem.recent.hiEnqShare, 0)} of them made 3+ enquiries in 30 days (industry ${F().pct(surge[0].c.ind.recent.hiEnqShare, 0)}) — a classic pattern of credit-hungry or organised applications, visible weeks before it shows up as delinquency.`,
        impact: [['Excess applications', '~' + Math.round(perDay) + ' / day', 'bad'], ['Signal lead time', '3–6 months before DPD', '']],
        action: { view: 'logins', params: { p, s: surge[0].st.id } },
        states: surge.map((x) => x.st.id), score: 1
      });
    }
    // 4) collections: cure rate falling faster than the market
    const cureDrop = states.map((st) => {
      const now = S.value('member', 'cure', { p, s: st.id, m: t }), was = S.value('member', 'cure', { p, s: st.id, m: S.monthsAgo(6) });
      const ind = S.value('industry', 'cure', { p, s: st.id, m: t }), indWas = S.value('industry', 'cure', { p, s: st.id, m: S.monthsAgo(6) });
      return { st, now, was, ind, drop: was - now - (indWas - ind) };
    }).sort((a, b) => b.drop - a.drop)[0];
    if (cureDrop && cureDrop.drop > 0.02) {
      recs.push({
        id: 'collections-' + p, priority: 3, kind: 'collections', p,
        title: `Shift early-bucket ${P.name} collections capacity to ${cureDrop.st.name}`,
        why: `Cure rate from 30–89 DPD fell from ${F().pct(cureDrop.was, 1)} to ${F().pct(cureDrop.now, 1)} in 6 months (industry now ${F().pct(cureDrop.ind, 1)}). Each point of cure recovered keeps accounts out of 90+.`,
        impact: [['Cure-rate gap to industry', F().pp(cureDrop.now - cureDrop.ind, 1), 'bad']],
        action: { view: 'benchmark', params: { p, metric: 'cure' } },
        states: [cureDrop.st.id], score: cureDrop.drop
      });
    }
    return recs;
  }

  function growthRec() {
    const t = S.latest();
    const ccM = S.value('member', 'dpd30', { p: 'CC', m: t }), ccP = S.peerValue('mid-pvt', 'dpd30', { p: 'CC', m: t });
    if (!(ccP && ccM < ccP - 0.003)) return null;
    const sh = S.value('member', 'bal', { p: 'CC', m: t }) / S.value('industry', 'bal', { p: 'CC', m: t });
    return {
      id: 'cc-growth', priority: 4, kind: 'growth', p: 'CC',
      title: 'Grow credit cards in prime segments — you are outperforming peers on risk',
      why: `Card 30+ DPD is ${F().pct(ccM)} vs ${F().pct(ccP)} for PVT · Mid-size peers, yet your share of the card market is only ${F().pct(sh, 2)}. Risk headroom can fund growth.`,
      impact: [['Risk headroom vs peers', F().bps(ccP - ccM).replace('+', ''), 'good']],
      action: { view: 'benchmark', params: { p: 'CC' } },
      states: [], score: 0
    };
  }

  // Ranked recommendations for a product, or across the whole portfolio (p = 'ALL')
  const recCache = new Map();
  function recommendations(p) {
    p = p || 'ALL';
    if (recCache.has(p)) return recCache.get(p);
    let recs = p === 'ALL' ? D.PRODUCTS.flatMap((x) => productRecs(x.id)) : productRecs(p);
    const g = growthRec();
    if (g && (p === 'ALL' || p === 'CC' || p === 'PL')) recs.push(g);
    recs = recs.sort((a, b) => a.priority - b.priority || b.score - a.score);
    recCache.set(p, recs);
    return recs;
  }

  // Plain-English narrative of a decomposition
  function narrateDecomposition(d) {
    const place = d.s && d.s !== 'ALL' ? D.S[d.s].name : 'all states';
    const tot = Math.abs(d.mix) + Math.abs(d.market) + Math.abs(d.own) || 1;
    const share = (x) => Math.round((Math.abs(x) / tot) * 100) + '%';
    const lead = [['a riskier portfolio mix', d.mix], ['market-wide deterioration', d.market], ['your own segments performing worse than the market', d.own]].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
    const top = d.segments.slice(0, 3).map((s) => s.label).join('; ');
    return {
      headline: `${pName(d.p)} ${S.METRICS[d.metric].short} across ${place} ${d.delta >= 0 ? 'rose' : 'fell'} ${F().bps(d.delta).replace('+', '')} (${F().pct(d.R0)} → ${F().pct(d.R1)}) between ${D.monthLabel(d.t0)} and ${D.monthLabel(d.t1)}. The industry moved ${F().bps(d.indDelta)}.`,
      drivers: `Mix shift explains ${share(d.mix)}, market-wide deterioration ${share(d.market)}, and member-specific performance ${share(d.own)}. The biggest driver is ${lead[0][0]}.`,
      segments: `Largest contributing segments: ${top}.`,
      verdict: Math.abs(d.market) > Math.abs(d.mix) + Math.abs(d.own) ? 'Mostly the market — you are moving with the industry.' : 'Mostly you — this is within your control.'
    };
  }

  PIQ.insights = { snapshot, recommendations, narrateDecomposition, driverLabel };
})(window);

  <script>/* js/sample.js */
/*
 * Generates the sample "member upload" file: the member's own sourcing-channel split, a field
 * the bureau does not hold. Consistent with the member dataset, so joins to industry work.
 */
(function (root) {
  const PIQ = (root.PIQ = root.PIQ || {});
  function sampleUploadCSV() {
    const D = PIQ.data;
    const months = D.MONTHS.slice(-6);
    const channels = ['Branch', 'DSA', 'Digital'];
    const lines = ['month,product,state,risk_band,sourcing_channel,balance_cr,dpd30_balance_cr'];
    months.forEach((m) => {
      D.STATES.forEach((st) => {
        D.BANDS.forEach((b) => {
          const r = D.cube.member.sum({ m, p: 'PL', s: st.id, b: b.id });
          const hot = (st.id === 'GJ' || st.id === 'UP') && (b.id === 'NP' || b.id === 'SB');
          const share = hot ? { Branch: 0.25, DSA: 0.55, Digital: 0.2 } : { Branch: 0.45, DSA: 0.3, Digital: 0.25 };
          const mult = hot
            ? { Branch: 0.62, DSA: st.id === 'GJ' ? 1.42 : 1.3, Digital: 0.85 }
            : { Branch: 0.88, DSA: 1.12, Digital: 1.02 };
          const norm = channels.reduce((a, c) => a + share[c] * mult[c], 0);
          const rate = r.d30 / r.bal;
          channels.forEach((c) => {
            const bal = r.bal * share[c];
            lines.push([m, 'PL', st.name, b.name, c, bal.toFixed(2), (bal * rate * mult[c] / norm).toFixed(3)].join(','));
          });
        });
      });
    });
    return lines.join('\n');
  }
  PIQ.sampleUploadCSV = sampleUploadCSV;
})(typeof window !== 'undefined' ? window : globalThis);

    productStateFilters(root, { dpd: true });

    // Hero: the one number
    const dec = S.decompose({ p, s, t0: C.policyChangeMonth, t1: S.latest(), metric: met });

    const hero = h('div', 'grid g-2-1', root);

    hr.style.cssText = 'display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:6px 0 10px';
    h('div', 'hero', hr, fmt.pct(snap.dpd));
    const dd = h('div', null, hr);
    h('div', 'stat-delta ' + tone(met, dec.delta), dd, fmt.bps(dec.delta) + ' since ' + ml(C.policyChangeMonth));
    h('div', 'stat-delta muted', dd, 'Industry ' + fmt.bps(dec.indDelta) + (snap.peer != null ? ' · Peers ' + fmt.bps(snap.peer - snap.peer6) + ' (6m)' : ''));
    const call = h('div', 'callout insight', hc);
    h('h4', null, call, nar.verdict);
    h('p', null, call, nar.drivers);
    // split bar
    const tot = Math.abs(dec.mix) + Math.abs(dec.market) + Math.abs(dec.own) || 1;
    const sb = h('div', 'split-bar', hc);
    [['Mix shift', dec.mix, 'var(--s1)'], ['Market', dec.market, 'var(--s3)'], ['Member-specific', dec.own, 'var(--s2)']].forEach(([n, v, c]) => {
      const seg = h('div', null, sb, Math.abs(v) / tot > 0.12 ? Math.round((Math.abs(v) / tot) * 100) + '%' : '');

      seg.title = n + ': ' + fmt.bps(v);
    });
    const lg = h('div', 'split-legend', hc);
    [['Mix shift', dec.mix, 'var(--s1)'], ['Market', dec.market, 'var(--s3)'], ['Member-specific', dec.own, 'var(--s2)']].forEach(([n, v, c]) => {
      const it = h('span', null, lg, `${n} ${fmt.bps(v)}`);
      it.style.setProperty('--c', c);
    });
    const go = h('div', null, hc);
    go.style.cssText = 'display:flex;gap:8px;margin-top:14px;flex-wrap:wrap';
    const b1 = h('button', 'btn primary', go, 'Why did it change? →');
    b1.addEventListener('click', () => PIQ.go('why'));
    const b2 = h('button', 'btn', go, '✦ Ask the AI analyst');
    b2.addEventListener('click', () => PIQ.openDrawer(`Why did my ${p === 'ALL' ? 'portfolio' : D.P[p].name.toLowerCase()} delinquency go up${s !== 'ALL' ? ' in ' + D.S[s].name : ''}?`));
    const mS = S.series('member', met, { p, s });
    const iS = S.series('industry', met, { p, s });
    const pS = S.peerSeries(state.peer, met, { p, s });
    const tv = h('div', 'viz', hc);

    // Alerts
    const ac = h('div', 'card', hero);
    const ah = h('div', 'card-head', ac);
    const at = h('div', null, ah);
    h('h3', null, at, 'Early-warning alerts');
    h('div', 'sub', at, 'Detected automatically on 30+ DPD and daily applications — nobody had to ask');
    S.alerts().slice(0, 4).forEach((a) => {
      const row = h('div', 'alert', ac);

      const tx = h('div', null, row);
      h('div', 'sev-label', tx, a.sev === 'good' ? 'Opportunity' : a.sev + ' · ' + (a.kind === 'logins' ? 'applications' : 'portfolio'));
      h('div', 'alert-title', tx, a.title);

    stat(tiles, { label: 'Delinquency buckets', value: '90+ ' + fmt.pct(snap.dpd90), delta: '30+ ' + fmt.pct(snap.dpd30) + ' · 180+ ' + fmt.pct(snap.dpd180), deltaTone: '', spark: sp('member', 'dpd90') });
    stat(tiles, { label: 'Collection cure rate', value: fmt.pct(snap.cure, 1), delta: fmt.pp(snap.cure - snap.cure6, 1), deltaTone: tone('cure', snap.cure - snap.cure6), deltaNote: '6m · industry ' + fmt.pct(snap.indCure, 1), spark: sp('member', 'cure') });

    // Portfolio by product (whole-book view)
    if (p === 'ALL') {
      const t = S.latest();
      const items = D.PRODUCTS.map((x) => ({ label: x.name, value: S.value('member', met, { p: x.id, s, m: t }), ref: S.value('industry', met, { p: x.id, s, m: t }), bal: S.value('member', 'bal', { p: x.id, s, m: t }) })).sort((a, b) => b.bal - a.bal);
      const g2 = h('div', 'grid g2', root);

      });
      PIQ.charts.bars(pc.viz, { items, fmt: (v) => fmt.pct(v), color: 'var(--s1)', valueName: 'You', refName: 'Industry' });
      const tot = items.reduce((a, x) => a + x.bal, 0);
      const bc = card(g2, { title: 'Where your book is', sub: 'Share of outstanding balance by product', source: sourceText(['member']) });

    PIQ.insights.recommendations(p).slice(0, 3).forEach((r, i) => {

      btn.style.cssText = 'margin-top:auto;align-self:flex-start';
      btn.addEventListener('click', () => PIQ.go(r.action.view, r.action.params));
    });
  }

  PIQ.views.overview = { title: 'Command Centre', render };
})();

      const pc = card(g, {

/* Peer Benchmarking — member vs peer group vs industry, with privacy guardrails enforced live. */
(function () {
  const PIQ = window.PIQ;
  const { h, fmt, ml, state, setState, card, stat, sourceText, pageHead, productStateFilters, select, stateName, prodLong } = PIQ.ui;
  const S = PIQ.sem, D = PIQ.data, C = PIQ.config;
  let metric = null; // null = follow the global delinquency bucket
  let custom = { types: ['PVT'], sizes: ['Mid'] };

  function render(root, params) {
    if (params && params.metric) metric = params.metric;
    if (!metric || S.DPD_METRICS.includes(metric)) metric = state.dpd;
    const p = state.p, s = state.s;
    pageHead(root, 'Peer Benchmarking', 'How you compare with a peer group you choose and with the whole market. Peers are always anonymised aggregates, and groups that could expose a single lender are blocked automatically.');
    const bar = productStateFilters(root);
    select(bar, 'Metric', S.DPD_METRICS.concat(['cure']).map((id) => ({ id, name: S.METRICS[id].name })), metric, (v) => { metric = v; if (S.DPD_METRICS.includes(v)) setState({ dpd: v }); else PIQ.go('benchmark'); });
    select(bar, 'Peer group', S.PEER_GROUPS.map((g) => ({ id: g.id, name: g.name + ' (' + S.peerMembers(g.types, g.sizes).length + ')' })).concat([{ id: 'custom', name: 'Custom…' }]), state.peer, (v) => setState({ peer: v }));

    const group = state.peer === 'custom' ? Object.assign({ id: 'custom', name: 'Custom group' }, custom) : S.PEER_GROUPS.find((g) => g.id === state.peer);
    if (state.peer === 'custom') {
      const cb = h('div', 'card', root);
      cb.style.marginBottom = '16px';
      h('h3', null, cb, 'Build a custom peer group');
      const row = h('div', null, cb);
      row.style.cssText = 'display:flex;gap:24px;flex-wrap:wrap;margin-top:10px';
      const mk = (label, list, key) => {
        const f = h('div', null, row);
        h('div', 'muted small', f, label);
        list.forEach(([id, name]) => {
          const l = h('label', null, f);
          l.style.cssText = 'display:inline-flex;gap:6px;margin:6px 12px 0 0;align-items:center';
          const i = h('input', null, l); i.type = 'checkbox'; i.checked = custom[key].includes(id);
          h('span', null, l, name);
          i.addEventListener('change', () => {
            custom[key] = i.checked ? custom[key].concat(id) : custom[key].filter((x) => x !== id);
            PIQ.go('benchmark');
          });
        });
      };
      mk('Category', D.LENDERS.map((l) => [l.id, l.name]), 'types');
      mk('Size', [['Mid', 'Mid-size'], ['Large', 'Large']], 'sizes');
    }
    const chk = S.peerCheck(group.types, group.sizes, { p, s });
    const pv = h('div', chk.ok ? 'callout okay' : 'suppressed', root);
    pv.style.marginBottom = '16px';
    if (chk.ok) {
      h('h4', null, pv, `✓ Privacy check passed: ${chk.n} institutions, largest is ${fmt.pct(chk.maxShare, 0)} of group balance`);
      h('p', null, pv, `Rules: at least ${C.privacy.minPeers} institutions, and no single institution above ${C.privacy.maxShare * 100}% of group balance. Peer names are never shown.`);
    } else {
      h('strong', null, pv, '⚠');
      const tx = h('div', null, pv);
      h('strong', null, tx, 'Peer benchmark suppressed. ');
      h('span', null, tx, chk.reason + ' Try a broader group.');
    }

    const t = S.latest(), t6 = S.monthsAgo(6);
    const M = S.METRICS[metric];
